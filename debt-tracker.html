<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Debts">
<title>Debts</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23eb6834'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='%23fff' font-family='system-ui,sans-serif' font-weight='700'%3E%E2%82%B9%3C/text%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light;
  --plane:#f1f2ee;--surface:#fcfcfb;--raised:#ffffff;
  --ink:#1c2028;--ink-2:#585d68;--muted:#80858e;
  --hair:#e3e4df;--base:#c5c7c0;--chip:#e9eae5;
  --exp:#eb6834;--exp-txt:#b2441a;--exp-track:#f8ddd0;
  --inc:#1baf7a;--inc-txt:#0b7a51;--inc-track:#cdeee0;
  --good:#0ca30c;--good-txt:#006300;--warn:#fab219;--crit:#d03b3b;--crit-txt:#b42323;
  --fab:#1c2028;--fab-ink:#ffffff;--focus:#2a78d6;
  --scrim:rgba(20,22,26,.45);--shadow:0 8px 24px rgba(20,22,26,.16);
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --plane:#0f0f0e;--surface:#1a1a19;--raised:#242422;
  --ink:#f0efec;--ink-2:#c3c2b7;--muted:#94938c;
  --hair:#2c2c2a;--base:#4a4a44;--chip:#2a2a27;
  --exp:#d95926;--exp-txt:#f28b5e;--exp-track:#3b2419;
  --inc:#199e70;--inc-txt:#45cb96;--inc-track:#15342a;
  --good-txt:#0ca30c;--crit-txt:#ff7b7b;
  --fab:#f0efec;--fab-ink:#1a1a19;--focus:#6aa5f0;
  --scrim:rgba(0,0,0,.6);--shadow:0 8px 24px rgba(0,0,0,.55);
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--plane)}
body{color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.exp{color:var(--exp-txt)}.inc{color:var(--inc-txt)}
.app{max-width:560px;margin:0 auto;height:100%;height:100dvh;display:flex;flex-direction:column;background:var(--plane)}
@media (min-width:600px){.app{border-inline:1px solid var(--hair)}}
main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:110px}

/* header */
.top{flex:none;background:var(--surface);border-bottom:1px solid var(--hair);padding:calc(env(safe-area-inset-top) + 6px) 12px 14px}
.topbar{display:flex;align-items:center;gap:6px;min-height:44px}
.title{margin:0 0 0 4px;font-size:20px;font-weight:750;letter-spacing:-.01em}
.icon-btn{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:active{background:var(--chip)}
.icon-btn svg{width:22px;height:22px}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;background:var(--chip);color:var(--ink-2);font-size:13px;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill[data-state=ok] i{background:var(--good)}
.pill[data-state=wait] i{background:var(--warn)}
.pill[data-state=err] i{background:var(--crit)}
.pill[data-state=busy] i{animation:blink .8s ease-in-out infinite alternate}
@keyframes blink{to{opacity:.2}}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 4px 0}
.tot{min-width:0}
.tot .lbl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.key{flex:none;width:9px;height:9px;border-radius:3px}
.key.exp{background:var(--exp)}.key.inc{background:var(--inc)}
.tot .val{display:block;font-size:clamp(22px,7vw,28px);font-weight:750;letter-spacing:-.02em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.split{display:flex;gap:2px;height:8px;margin:12px 4px 0}
.split span{border-radius:99px;min-width:0;transition:flex-grow .35s ease}
.split .s-owe{background:var(--exp)}.split .s-owed{background:var(--inc)}
.note{margin:6px 4px 0;font-size:13px;color:var(--ink-2)}

/* account list */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:16px 16px 8px;font-size:14px;font-weight:700}
.sec-head small{font-weight:400;color:var(--ink-2);font-size:13px}
.list{list-style:none;margin:0 12px;padding:0;background:var(--surface);border:1px solid var(--hair);border-radius:16px;overflow:hidden}
.list>li+li{border-top:1px solid var(--hair)}
.acct{width:100%;display:flex;align-items:center;gap:12px;padding:11px 12px;min-height:64px;text-align:left}
.acct:active{background:var(--chip)}
.av{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:750;font-size:16px;background:var(--chip);color:var(--ink-2)}
.a-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.a-name{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-sub{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-right{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.a-amt{font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}
.a-dir{font-size:12px;color:var(--ink-2);white-space:nowrap}
.mini{display:block;height:4px;margin-top:5px;border-radius:4px;overflow:hidden;background:var(--exp-track)}
.mini.owed{background:var(--inc-track)}
.mini span{display:block;height:100%;border-radius:4px;background:var(--exp)}
.mini.owed span{background:var(--inc)}
details.settled{margin-top:4px}
details.settled summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;margin:16px 16px 8px;font-size:14px;font-weight:700;color:var(--ink-2)}
details.settled summary::-webkit-details-marker{display:none}
details.settled summary svg{width:18px;height:18px;transition:transform .2s}
details.settled[open] summary svg{transform:rotate(90deg)}
.empty{padding:44px 24px;text-align:center;color:var(--ink-2)}
.empty.slim{padding:16px 8px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.notice{margin:12px 12px 0;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--hair);display:flex;align-items:center;gap:12px}
.notice p{margin:0;flex:1;font-size:14px;color:var(--ink-2)}
.notice b{color:var(--ink)}
.xfab{position:fixed;z-index:30;bottom:calc(18px + env(safe-area-inset-bottom));right:max(16px,calc((100vw - 560px) / 2 + 16px));height:56px;padding:0 20px 0 16px;border-radius:18px;background:var(--fab);color:var(--fab-ink);display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:750;box-shadow:var(--shadow)}
.xfab svg{width:24px;height:24px}
.xfab:active{transform:scale(.97)}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .2s}
.sheet{position:relative;width:100%;max-width:560px;max-height:94%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:22px 22px 0 0;padding:6px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet-wrap.open .scrim{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.sheet-wrap.page .sheet{height:100%;max-height:none;border-radius:0;background:var(--plane);padding:0 0 calc(110px + env(safe-area-inset-bottom));transform:translateX(100%)}
.sheet-wrap.page.open .sheet{transform:none}
@media (prefers-reduced-motion:reduce){.scrim,.sheet,.split span{transition:none}}
.grab{width:38px;height:4px;border-radius:4px;background:var(--hair);margin:4px auto 6px}
.sheet-head{display:flex;align-items:center;gap:6px;min-height:46px}
.sheet-head h2{margin:0;flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:18px;font-weight:750}
.sheet-head h2 .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{margin:8px 0 0;font-size:13px;color:var(--ink-2)}
.sec{margin:22px 0 4px;font-size:15px;font-weight:750}

/* account page */
.page-top{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--hair);padding:calc(env(safe-area-inset-top) + 6px) 12px 16px}
.page-top .topbar h2{margin:0;flex:1;min-width:0;font-size:19px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big{margin:6px 4px 0}
.big .lbl{font-size:13px;color:var(--ink-2)}
.big .val{font-size:clamp(26px,8.5vw,34px);font-weight:750;letter-spacing:-.02em;line-height:1.15}
.stats{display:flex;flex-wrap:wrap;gap:4px 18px;margin:6px 4px 0;font-size:13px;color:var(--ink-2)}
.stats b{color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}
.meter{height:8px;margin:12px 4px 0;border-radius:99px;background:var(--exp-track);overflow:hidden}
.meter.owed{background:var(--inc-track)}
.meter span{display:block;height:100%;border-radius:99px;background:var(--exp)}
.meter.owed span{background:var(--inc)}
.page-actions{display:flex;gap:10px;margin:14px 4px 0}
.entries{list-style:none;margin:0 12px;padding:0;display:grid;gap:10px}
.entry{background:var(--surface);border:1px solid var(--hair);border-radius:16px;overflow:hidden}
.e-main{width:100%;display:block;padding:12px 14px 10px;text-align:left}
.e-main:active{background:var(--chip)}
.e-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.e-date{font-size:13px;color:var(--ink-2)}
.e-amt{font-weight:750;font-size:17px;font-variant-numeric:tabular-nums}
.e-remark{font-weight:650;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.e-row .e-remark{flex:1;min-width:0}
.e-due{font-size:14px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.e-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px 12px}
.e-foot .pct{font-size:13px;color:var(--ink-2)}
.e-foot .mini{flex:1;margin:0}
.tag{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--ink-2)}
.tag .key{width:7px;height:7px;border-radius:2px}
.danger-links{display:flex;gap:10px;justify-content:center;margin:28px 12px 0}

/* entry sheet */
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.fact{background:var(--plane);border-radius:12px;padding:10px 12px;min-width:0}
.fact .k{font-size:12px;color:var(--ink-2)}
.fact .v{font-size:16px;font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pays{list-style:none;margin:6px 0 0;padding:0}
.pay{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--hair)}
.pay:first-child{border-top:0}
.pay .p-main{flex:1;min-width:0;display:flex;flex-direction:column}
.pay .p-date{font-weight:600}
.pay .p-note{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pay .p-amt{font-weight:750;font-variant-numeric:tabular-nums}
.pay .icon-btn{width:36px;height:36px}
.pay .icon-btn svg{width:18px;height:18px}

/* forms */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;border-radius:13px;background:var(--chip)}
.seg button{height:40px;border-radius:10px;font-weight:650;color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;gap:7px}
.seg button[aria-pressed=true]{background:var(--raised);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.field{display:block;margin-top:14px}
.field .lb{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px}
.input{width:100%;height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--hair);background:var(--raised);font-size:16px;outline:none}
.input:focus{border-color:var(--focus);box-shadow:0 0 0 1px var(--focus)}
.money-in{display:flex;align-items:center;gap:4px;height:66px;padding:0 14px;border-radius:14px;border:1px solid var(--hair);background:var(--raised)}
.money-in:focus-within{border-color:var(--focus);box-shadow:0 0 0 1px var(--focus)}
.money-in .cur{font-size:26px;font-weight:650;color:var(--ink-2)}
.money-in input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;font-size:32px;font-weight:750;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;height:34px;padding:0 13px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:650;color:var(--ink-2);white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.btn{height:50px;border-radius:14px;padding:0 18px;font-size:16px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--fab);color:var(--fab-ink);flex:1}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.danger{color:var(--crit-txt)}
.btn.wide{width:100%;margin-top:10px}
.btn.small{height:38px;padding:0 14px;border-radius:11px;font-size:14px}
.btn svg{width:20px;height:20px}
.actions{display:flex;gap:10px;margin-top:20px}
.err{margin:10px 0 0;font-size:14px;color:var(--crit-txt)}
.okmsg{margin:10px 0 0;font-size:14px;color:var(--good-txt)}
.link-btn{flex:none;height:32px;padding:0 11px;border-radius:9px;font-size:13px;font-weight:650;color:var(--ink-2);background:var(--chip)}
.pw{display:flex;gap:8px;align-items:center}
.pw .input{flex:1}
.sync-info{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--plane);font-size:13px;color:var(--ink-2)}
.sync-info p{margin:0}
.sync-info p+p{margin-top:4px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:16px;width:max-content;max-width:calc(100% - 32px);padding:11px 14px;border-radius:12px;background:var(--ink);color:var(--surface);font-size:14px;box-shadow:var(--shadow)}
.toast.at-top{top:calc(env(safe-area-inset-top) + 12px);bottom:auto}
.toast button{color:inherit;font-weight:750;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="topbar">
      <h1 class="title">Debts</h1>
      <span class="spacer"></span>
      <button class="pill" id="syncPill" data-h="sync"><i></i><span></span></button>
      <button class="icon-btn" data-h="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
    </div>
    <div class="totals">
      <div class="tot"><span class="lbl"><i class="key exp"></i>You owe</span><span class="val" id="tOwe"></span></div>
      <div class="tot"><span class="lbl"><i class="key inc"></i>Owed to you</span><span class="val" id="tOwed"></span></div>
    </div>
    <div class="split" id="split" role="img"><span class="s-owe"></span><span class="s-owed"></span></div>
    <p class="note" id="splitNote"></p>
  </header>
  <main id="main"></main>
</div>
<button class="xfab" data-n="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add debt</button>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
'use strict';
/* =====================================================================
   Debt tracker. Data lives in your Google Sheet (tabs "Debts" and
   "DebtPayments", via the Apps Script in Code.gs) with a copy on this
   phone, so it opens instantly and works offline.
   ===================================================================== */
const APP = { store: 'debt.v1', settings: 'debt.settings', alt: 'money.settings', tables: ['Debts', 'DebtPayments'] };
const OWE = 'I owe', OWED = 'Owes me';

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const isYmd = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmtDate = s => { if (!isYmd(s)) return 'No date'; const d = parseD(s); return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const round2 = n => Math.round(n * 100) / 100;
const toNum = v => { const n = typeof v === 'number' ? v : parseFloat(String(v ?? '').replace(/[^0-9.\-]/g, '')); return Number.isFinite(n) ? n : 0; };
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const nf0 = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function inr(n) { const a = round2(Math.abs(n)); return (n < 0 ? '−' : '') + '₹' + (a % 1 ? nf2.format(a) : nf0.format(a)); }
const pctTxt = (part, whole) => { if (!(whole > 0)) return '0%'; const p = (part / whole) * 100; return p > 0 && p < 1 ? '<1%' : `${Math.floor(p)}%`; };
const ICONS = {
  close: '<path d="M6 6l12 12M18 6 6 18"/>', back: '<path d="M15 5l-7 7 7 7"/>', chev: '<path d="M9 5l7 7-7 7"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'
};
const icon = n => `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
const closeBtn = `<button class="icon-btn" data-act="close" aria-label="Close">${icon('close')}</button>`;
const dirTag = owed => `<span class="tag"><i class="key ${owed ? 'inc' : 'exp'}"></i>${owed ? OWED : OWE}</span>`;
// Wording that changes with the direction of the debt
const words = owed => owed
  ? { amount: 'Lent', paid: 'Received', pay: 'Record payment', paySheet: 'Money received', list: 'Money received', on: 'Lent on' }
  : { amount: 'Borrowed', paid: 'Repaid', pay: 'Pay back', paySheet: 'Pay back', list: 'Payments made', on: 'Borrowed on' };

/* ---------- state ---------- */
const S = {
  data: { Debts: [], DebtPayments: [] }, outbox: [], lastSync: 0,
  settings: { url: '', key: '' }, sync: { busy: false, pulling: false, error: '' },
  writes: 0, lastPull: 0
};

const NORM = {
  Debts: r => ({
    id: String(r.id ?? ''), account: String(r.account ?? '').trim().replace(/\s+/g, ' ') || 'Unnamed',
    direction: /owes\s*me|^owed|^lent|^receiv|^given/i.test(String(r.direction ?? '').trim()) ? OWED : OWE,
    amount: Math.abs(toNum(r.amount)), date: normDate(r.date), remark: String(r.remark ?? '').trim()
  }),
  DebtPayments: r => ({
    id: String(r.id ?? ''), debtId: String(r.debtId ?? ''), account: String(r.account ?? '').trim(),
    amount: Math.abs(toNum(r.amount)), date: normDate(r.date), note: String(r.note ?? '').trim()
  })
};
function normDate(v) {
  const s = String(v ?? '').trim(), m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  const d = new Date(s);
  return isNaN(d) ? '' : ymd(d);
}
function normalizeAll(d) {
  const o = {};
  APP.tables.forEach(t => { o[t] = (Array.isArray(d[t]) ? d[t] : []).map(NORM[t]).filter(r => r.id); });
  return o;
}

function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(APP.store) || 'null');
    if (raw) { S.data = normalizeAll(raw.data || {}); S.outbox = Array.isArray(raw.outbox) ? raw.outbox : []; S.lastSync = raw.lastSync || 0; }
  } catch (e) { /* unreadable cache: start fresh, the sheet still has everything */ }
  try {
    let st = JSON.parse(localStorage.getItem(APP.settings) || 'null');
    if (!st) { // reuse the money tracker's connection when both apps are on the same site
      st = JSON.parse(localStorage.getItem(APP.alt) || 'null');
      if (st && st.url) localStorage.setItem(APP.settings, JSON.stringify(st));
    }
    if (st) S.settings = { url: st.url || '', key: st.key || '' };
  } catch (e) {}
}
function save() {
  try { localStorage.setItem(APP.store, JSON.stringify({ data: S.data, outbox: S.outbox, lastSync: S.lastSync })); }
  catch (e) { toast('This phone’s storage is full. Changes still go to your sheet.'); }
}

/* ---------- sync with the Google Sheet ---------- */
const connected = () => !!(S.settings.url && S.settings.key);

async function api(body) {
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 45000);
  try {
    const res = await fetch(S.settings.url, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ ...body, key: S.settings.key }), signal: ctrl.signal, redirect: 'follow'
    });
    const text = await res.text();
    let json;
    try { json = JSON.parse(text); } catch (e) { throw new Error(res.ok ? 'That URL did not answer like the Apps Script. Check it in Settings.' : `Google returned error ${res.status}.`); }
    if (!json.ok) throw new Error(json.error || 'The sheet refused the request.');
    return json;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('No reply from Google. Check your connection.');
    if (e instanceof TypeError) throw new Error('Could not reach Google. You may be offline, or the deployment is not set to “Anyone”.');
    throw e;
  } finally { clearTimeout(timer); }
}

function applyLocal(op) {
  const arr = S.data[op.table];
  if (!arr) return;
  const id = op.op === 'delete' ? op.id : op.row && op.row.id;
  const i = arr.findIndex(r => r.id === id);
  if (op.op === 'delete') { if (i >= 0) arr.splice(i, 1); return; }
  if (i >= 0) arr[i] = NORM[op.table]({ ...arr[i], ...op.row });
  else arr.push(NORM[op.table]({ ...op.row }));
}

function commit(ops, msg, undoOps) {
  ops.forEach(op => { op.opId = uid(); applyLocal(op); S.outbox.push(op); });
  S.writes++;
  save(); renderAll(); flush();
  if (msg) toast(msg, undoOps ? () => commit(undoOps, 'Restored') : null);
}

let flushing = null, retryTimer = null;
function flush() { if (!flushing) flushing = doFlush().finally(() => { flushing = null; }); return flushing; }
async function doFlush() {
  if (!connected() || !S.outbox.length) { paintSync(); return; }
  S.sync.busy = true; paintSync();
  try {
    while (S.outbox.length) {
      const batch = S.outbox.slice(0, 400);
      await api({ action: 'apply', ops: batch.map(({ opId, ...o }) => o) });
      const done = new Set(batch.map(o => o.opId));
      S.outbox = S.outbox.filter(o => !done.has(o.opId));
      save();
    }
    S.sync.error = ''; S.lastSync = Date.now(); save();
  } catch (e) {
    S.sync.error = e.message;
    clearTimeout(retryTimer); retryTimer = setTimeout(flush, 30000);
  } finally { S.sync.busy = false; paintSync(); }
}

let pulling = null;
function pull() { if (!pulling) pulling = doPull().finally(() => { pulling = null; }); return pulling; }
async function doPull() {
  if (!connected()) { paintSync(); return; }
  S.lastPull = Date.now();
  await flush();
  if (S.outbox.length) return;
  const w = S.writes;
  S.sync.pulling = true; paintSync();
  try {
    const res = await api({ action: 'get', tables: APP.tables });
    if (w !== S.writes) return;
    S.data = normalizeAll(res.data || {});
    S.outbox.forEach(applyLocal);
    S.lastSync = Date.now(); S.sync.error = '';
    save(); renderAll();
  } catch (e) { S.sync.error = e.message; }
  finally { S.sync.pulling = false; paintSync(); }
}

function timeAgo(t) {
  const s = (Date.now() - t) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  const d = new Date(t), hm = d.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
  return ymd(d) === today() ? `at ${hm}` : `${fmtDate(ymd(d))}, ${hm}`;
}
function syncInfoHtml() {
  if (!connected()) return '<p>Not connected. Changes stay on this phone until you connect.</p>';
  const p = [S.lastSync ? `Last synced ${timeAgo(S.lastSync)}.` : 'Not synced yet.'];
  if (S.outbox.length) p.push(`${plural(S.outbox.length, 'change', 'changes')} waiting to upload.`);
  if (S.sync.error) p.push(`Last problem: ${S.sync.error}`);
  return p.map(x => `<p>${esc(x)}</p>`).join('');
}
function paintSync() {
  const pill = $('#syncPill');
  let state = 'ok', text = 'Synced';
  if (!connected()) { state = 'off'; text = 'Not connected'; }
  else if (S.sync.busy || S.sync.pulling) { state = 'busy'; text = 'Syncing'; }
  else if (S.sync.error) { state = 'err'; text = S.outbox.length ? `${S.outbox.length} not synced` : 'Sync failed'; }
  else if (S.outbox.length) { state = 'wait'; text = `${S.outbox.length} waiting`; }
  pill.dataset.state = state;
  pill.lastElementChild.textContent = text;
  pill.setAttribute('aria-label', `Sync status: ${text}`);
  const info = $('#syncInfo');
  if (info) info.innerHTML = syncInfoHtml();
}

/* ---------- layers (sheets, account page) + Android back button ---------- */
const layers = [], openSheets = [];
let pendingBack = 0;
function pushLayer(close) { layers.push(close); history.pushState({ layer: layers.length }, ''); }
function popLayer() { if (layers.length > pendingBack) { pendingBack++; history.back(); } }
addEventListener('popstate', () => { if (pendingBack) pendingBack--; const close = layers.pop(); if (close) close(); });

function sheet({ view, act = {}, state, after, live, enter, page }) {
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap' + (page ? ' page' : '');
  wrap.innerHTML = '<div class="scrim"></div><section class="sheet" role="dialog" aria-modal="true"></section>';
  const el = wrap.lastElementChild;
  const api = {
    el, live,
    draw() { const y = el.scrollTop; el.innerHTML = view(); el.scrollTop = y; if (after) after(api); },
    close: popLayer,
    error(msg) { const e = $('.err', el); if (e) { e.textContent = msg; e.hidden = false; } }
  };
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (b && el.contains(b) && act[b.dataset.act]) { e.preventDefault(); act[b.dataset.act](b, e); }
  });
  if (state) {
    const sync = e => {
      const n = e.target.name;
      if (n && n in state) state[n] = e.target.value;
      // keep quick-pick chips in step with what was typed or picked by hand
      if (n === 'date') $$('[data-act=day]', el).forEach(c => c.setAttribute('aria-pressed', String(c.dataset.v === e.target.value)));
      if (n === 'amount') $$('[data-act=fill]', el).forEach(c => c.setAttribute('aria-pressed', String(toNum(e.target.value) === toNum(c.dataset.v))));
    };
    el.addEventListener('input', sync); el.addEventListener('change', sync);
  }
  el.addEventListener('keydown', e => { if (e.key === 'Enter' && enter && e.target.matches('input')) { e.preventDefault(); enter(e.target); } });
  wrap.firstElementChild.addEventListener('click', popLayer);
  document.body.appendChild(wrap);
  openSheets.push(api);
  api.draw();
  requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('open')));
  pushLayer(() => {
    openSheets.splice(openSheets.indexOf(api), 1);
    wrap.classList.remove('open');
    setTimeout(() => wrap.remove(), 280);
  });
  return api;
}

let toastTimer;
function toast(msg, undo) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button">Undo</button>' : ''}`;
  t.classList.toggle('at-top', layers.length - pendingBack > 0); // a sheet is still open: keep its content clear
  t.hidden = false;
  if (undo) t.querySelector('button').onclick = () => { t.hidden = true; undo(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, undo ? 5000 : 2400);
}

/* ---------- the model: accounts -> entries -> payments ---------- */
const byDateAsc = (a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a._i - b._i);
function model() {
  const pays = {};
  S.data.DebtPayments.forEach((p, i) => { (pays[p.debtId] = pays[p.debtId] || []).push({ ...p, _i: i }); });
  const accts = new Map();
  S.data.Debts.forEach((d, i) => {
    const ps = (pays[d.id] || []).sort(byDateAsc);
    const paid = round2(ps.reduce((s, p) => s + p.amount, 0));
    const e = { ...d, _i: i, owed: d.direction === OWED, payments: ps, paid, due: Math.max(0, round2(d.amount - paid)) };
    const key = d.account.toLowerCase();
    let a = accts.get(key);
    if (!a) accts.set(key, (a = { key, name: d.account, entries: [], iOwe: 0, owesMe: 0, total: 0, repaid: 0, last: '' }));
    a.entries.push(e);
    if (e.owed) a.owesMe += e.due; else a.iOwe += e.due;
    a.total += d.amount; a.repaid += Math.min(paid, d.amount);
    [d.date, ...ps.map(p => p.date)].forEach(x => { if (x > a.last) a.last = x; });
  });
  const list = [...accts.values()];
  list.forEach(a => {
    a.iOwe = round2(a.iOwe); a.owesMe = round2(a.owesMe); a.net = round2(a.owesMe - a.iOwe);
    a.open = a.entries.filter(e => e.due > 0).length;
    a.mixed = a.entries.some(e => e.owed) && a.entries.some(e => !e.owed);
  });
  return list;
}
const findAccount = key => model().find(a => a.key === key);
function findEntry(id) { for (const a of model()) { const e = a.entries.find(x => x.id === id); if (e) return { a, e }; } return null; }

/* ---------- rendering ---------- */
function renderAll() { const accts = model(); renderHeader(accts); renderHome(accts); openSheets.forEach(s => { if (s.live) s.draw(); }); }

function renderHeader(accts) {
  const owe = round2(accts.reduce((s, a) => s + a.iOwe, 0)), owed = round2(accts.reduce((s, a) => s + a.owesMe, 0)), net = round2(owed - owe);
  $('#tOwe').textContent = inr(owe);
  $('#tOwed').textContent = inr(owed);
  const split = $('#split');
  split.hidden = !(owe + owed > 0);
  split.firstElementChild.style.flexGrow = owe; split.lastElementChild.style.flexGrow = owed;
  split.firstElementChild.hidden = !owe; split.lastElementChild.hidden = !owed;
  split.setAttribute('aria-label', `You owe ${inr(owe)}, owed to you ${inr(owed)}`);
  $('#splitNote').textContent = owe + owed === 0 ? 'Nothing outstanding.' : net < 0 ? `Overall you owe ${inr(-net)} more than you are owed.` : net > 0 ? `Overall you are owed ${inr(net)} more than you owe.` : 'What you owe and what you are owed are equal.';
}

function accountSummary(a) {
  if (!a.open) return { amt: '₹0', cls: '', dir: 'Settled' };
  if (a.net < 0) return { amt: inr(-a.net), cls: 'exp', dir: a.mixed ? 'You owe, net' : 'You owe' };
  if (a.net > 0) return { amt: inr(a.net), cls: 'inc', dir: a.mixed ? 'Owes you, net' : 'Owes you' };
  return { amt: '₹0', cls: '', dir: 'Even' };
}
function acctRow(a) {
  const s = accountSummary(a), owedSide = a.net > 0;
  const sub = a.open ? `${plural(a.open, 'open entry', 'open entries')}, last ${fmtDate(a.last).slice(0, -5)}` : `${plural(a.entries.length, 'entry', 'entries')}, last ${fmtDate(a.last)}`;
  const bar = a.open ? `<span class="mini${owedSide ? ' owed' : ''}" aria-hidden="true"><span style="width:${a.total ? ((a.repaid / a.total) * 100).toFixed(1) : 0}%"></span></span>` : '';
  return `<li><button class="acct" data-act="acct" data-key="${esc(a.key)}"><span class="av" aria-hidden="true">${esc(a.name.charAt(0).toUpperCase())}</span><span class="a-main"><span class="a-name">${esc(a.name)}</span><span class="a-sub">${esc(sub)}</span>${bar}</span><span class="a-right"><span class="a-amt ${s.cls}">${s.amt}</span><span class="a-dir">${s.dir}</span></span></button></li>`;
}

function renderHome(accts) {
  const active = accts.filter(a => a.open).sort((x, y) => Math.abs(y.net) - Math.abs(x.net) || (x.last < y.last ? 1 : -1));
  const settled = accts.filter(a => !a.open).sort((x, y) => (x.last < y.last ? 1 : -1));
  let h = '';
  if (!connected()) h += `<div class="notice"><p><b>Connect your Google Sheet.</b> Until then, changes stay on this phone.</p><button class="btn ghost small" data-act="settings">Connect</button></div>`;
  if (!accts.length) h += '<div class="empty"><b>No debts yet</b>Tap Add debt to record money you owe or money someone owes you.</div>';
  if (active.length) h += `<div class="sec-head"><span>Open accounts</span><small>${active.length}</small></div><ul class="list">${active.map(acctRow).join('')}</ul>`;
  else if (accts.length) h += '<div class="empty"><b>All settled</b>Nothing is outstanding right now.</div>';
  if (settled.length) h += `<details class="settled"${active.length ? '' : ' open'}><summary>${icon('chev')}Settled accounts (${settled.length})</summary><ul class="list">${settled.map(acctRow).join('')}</ul></details>`;
  $('#main').innerHTML = h;
}

/* ---------- account page ---------- */
function openAccount(key) {
  const st = { key };
  const act = {
    close: () => sh.close(),
    entry: b => openEntry(b.dataset.id),

    rename: () => { const a = findAccount(st.key); if (a) openRename(a, newKey => { st.key = newKey; }); },
    remove: () => {
      const a = findAccount(st.key);
      if (!a) return;

      if (!confirm(`Delete “${a.name}” with ${plural(a.entries.length, 'entry', 'entries')} and ${plural(pays.length, 'payment', 'payments')}? This also removes them from your sheet.`)) return;
      const ops = [...a.entries.map(e => ({ op: 'delete', table: 'Debts', id: e.id })), ...pays.map(p => ({ op: 'delete', table: 'DebtPayments', id: p.id }))];
      const undo = [...a.entries.map(e => ({ op: 'upsert', table: 'Debts', row: pickDebt(e) })), ...pays.map(p => ({ op: 'upsert', table: 'DebtPayments', row: pickPay(p) }))];

        <div class="big"><div class="lbl">${esc(label)}</div><div class="val ${s.cls}">${s.amt}</div></div>
        <div class="stats"><span>Total <b>${inr(a.total)}</b></span><span>Paid back <b>${inr(a.repaid)}</b></span>${a.mixed ? `<span>You owe <b>${inr(a.iOwe)}</b></span><span>Owes you <b>${inr(a.owesMe)}</b></span>` : ''}</div>
        <div class="meter${owedSide ? ' owed' : ''}" role="img" aria-label="${pctTxt(a.repaid, a.total)} paid back"><span style="width:${a.total ? ((a.repaid / a.total) * 100).toFixed(1) : 0}%"></span></div>

      h += open.length ? `<ul class="entries">${open.map(entryCard).join('')}</ul>` : '<div class="empty slim">Nothing open on this account.</div>';
      if (done.length) h += `<details class="settled"${open.length ? '' : ' open'}><summary>${icon('chev')}Settled entries (${done.length})</summary><ul class="entries">${done.map(entryCard).join('')}</ul></details>`;

/* ---------- one entry: facts + payment history ---------- */
const pickDebt = e => ({ id: e.id, account: e.account, direction: e.direction, amount: e.amount, date: e.date, remark: e.remark });
const pickPay = p => ({ id: p.id, debtId: p.debtId, account: p.account, amount: p.amount, date: p.date, note: p.note });

        <div class="actions"><button class="btn danger" data-act="del">Delete</button><button class="btn ghost" data-act="edit">Edit</button>${e.due > 0 ? `<button class="btn primary" data-act="pay">${w.pay}</button>` : ''}</div>`;

/* ---------- record a payment against one entry (full or partial) ---------- */
function openPay(id) {
  const f0 = findEntry(id);
  if (!f0) return;
  const st = { amount: String(f0.e.due), date: today(), note: '' };
  const act = {
    close: () => sh.close(),
    fill: b => { st.amount = b.dataset.v; sh.draw(); },
    day: b => { st.date = b.dataset.v; sh.draw(); },
    save: () => {
      const f = findEntry(id);
      if (!f) return sh.error('This entry no longer exists.');
      const amount = round2(toNum(st.amount));
      if (!(amount > 0)) return sh.error('Enter an amount above zero.');
      if (amount > f.e.due + 0.001) return sh.error(`That is more than the ${inr(f.e.due)} due on this entry.`);
      if (!isYmd(st.date)) return sh.error('Choose a date.');
      sh.close();
      const left = round2(f.e.due - amount);
      commit([{ op: 'upsert', table: 'DebtPayments', row: { id: uid(), debtId: f.e.id, account: f.e.account, amount, date: st.date, note: st.note.trim() } }],
        left > 0 ? `Saved. ${inr(left)} still due` : 'Saved. This entry is settled');
    }
  };
  const sh = sheet({
    state: st, act, enter: el => { if (el.name === 'amount') { const n = $('[name=note]', sh.el); if (n) n.focus(); } else act.save(); },
    view: () => {
      const f = findEntry(id) || f0, e = f.e, w = words(e.owed), t = today(), y = addDays(t, -1), half = round2(e.due / 2);
      return `<div class="grab"></div>
        <div class="sheet-head"><h2><span class="t">${w.paySheet}</span></h2>${closeBtn}</div>
        <p class="hint" style="margin-top:0">${esc(f.a.name)}${e.remark ? `, ${esc(e.remark)}` : ''}. Due ${inr(e.due)} of ${inr(e.amount)}.</p>
        <label class="field"><span class="lb">Amount</span><span class="money-in"><span class="cur">₹</span><input name="amount" inputmode="decimal" autocomplete="off" value="${esc(st.amount)}" enterkeyhint="next" aria-label="Amount in rupees"></span></label>
        <div class="chips"><button class="chip" data-act="fill" data-v="${e.due}" aria-pressed="${toNum(st.amount) === e.due}">Full ${inr(e.due)}</button>${half > 0 && half < e.due ? `<button class="chip" data-act="fill" data-v="${half}" aria-pressed="${toNum(st.amount) === half}">Half ${inr(half)}</button>` : ''}</div>
        <label class="field"><span class="lb">Date</span><input class="input" type="date" name="date" value="${esc(st.date)}"></label>
        <div class="chips"><button class="chip" data-act="day" data-v="${t}" aria-pressed="${st.date === t}">Today</button><button class="chip" data-act="day" data-v="${y}" aria-pressed="${st.date === y}">Yesterday</button></div>
        <label class="field"><span class="lb">Note</span><input class="input" name="note" value="${esc(st.note)}" placeholder="Optional, e.g. UPI or cash" autocomplete="off" enterkeyhint="done"></label>
        <p class="err" hidden></p>
        <div class="actions"><button class="btn primary" data-act="save">Save payment</button></div>`;
    }
  });
}

/* ---------- add a debt, or edit one entry ---------- */
function openDebt(entry, preset = {}) {
  const edit = !!entry;
  const st = {
    owed: edit ? entry.owed : !!preset.owed, amount: edit ? String(entry.amount) : '',
    account: edit ? entry.account : preset.account || '', date: edit ? entry.date : today(), remark: edit ? entry.remark : ''
  };
  const accountsByUse = () => model().sort((a, b) => (a.last < b.last ? 1 : -1));
  const act = {
    close: () => sh.close(),
    dir: b => { st.owed = b.dataset.v === 'owed'; sh.draw(); },
    acct: b => { st.account = b.dataset.v; sh.draw(); },
    day: b => { st.date = b.dataset.v; sh.draw(); },
    save: () => {
      const amount = round2(toNum(st.amount));
      let account = st.account.trim().replace(/\s+/g, ' ');
      if (!(amount > 0)) return sh.error('Enter an amount above zero.');
      if (!account) return sh.error('Choose an account or type a new one.');
      if (!isYmd(st.date)) return sh.error('Choose a date.');
      const same = model().find(a => a.key === account.toLowerCase());
      if (same) account = same.name; // reuse the existing spelling
      if (!edit) {
        sh.close();
        commit([{ op: 'upsert', table: 'Debts', row: { id: uid(), account, direction: st.owed ? OWED : OWE, amount, date: st.date, remark: st.remark.trim() } }], same ? `Added to ${account}` : `Added ${account}`);
        return;
      }
      const f = findEntry(entry.id);
      if (!f) return sh.error('This entry no longer exists.');
      if (amount + 0.001 < f.e.paid) return sh.error(`${inr(f.e.paid)} is already paid on this entry, so the amount cannot be lower.`);
      const ops = [{ op: 'upsert', table: 'Debts', row: { id: f.e.id, account, direction: st.owed ? OWED : OWE, amount, date: st.date, remark: st.remark.trim() } }];
      if (account !== f.e.account) f.e.payments.forEach(p => ops.push({ op: 'upsert', table: 'DebtPayments', row: { id: p.id, account } }));
      sh.close();
      commit(ops, 'Changes saved');
    }
  };
  const sh = sheet({
    state: st, act, enter: el => { const order = ['amount', 'account', 'remark']; const i = order.indexOf(el.name); const next = i >= 0 && i < order.length - 1 && $(`[name=${order[i + 1]}]`, sh.el); if (next) next.focus(); else act.save(); },
    after: api => { if (!edit && !st.amount) { const a = $('[name=amount]', api.el); if (a) setTimeout(() => a.focus(), 80); } },
    view: () => {
      const t = today(), y = addDays(t, -1), typed = st.account.trim().toLowerCase();
      const list = accountsByUse().slice(0, 12), known = typed && model().some(a => a.key === typed);
      return `<div class="grab"></div>
        <div class="sheet-head"><h2><span class="t">${edit ? 'Edit entry' : 'Add debt'}</span></h2>${closeBtn}</div>
        <div class="seg" role="group" aria-label="Who owes whom"><button data-act="dir" data-v="owe" aria-pressed="${!st.owed}"><i class="key exp"></i>I owe</button><button data-act="dir" data-v="owed" aria-pressed="${st.owed}"><i class="key inc"></i>Owes me</button></div>
        <label class="field"><span class="lb">Amount</span><span class="money-in"><span class="cur">₹</span><input name="amount" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(st.amount)}" enterkeyhint="next" aria-label="Amount in rupees"></span></label>
        <label class="field"><span class="lb">Account</span><input class="input" name="account" value="${esc(st.account)}" placeholder="Person, card or loan" autocomplete="off" enterkeyhint="next"></label>
        ${list.length ? `<div class="chips scroll" aria-label="Existing accounts">${list.map(a => `<button class="chip" data-act="acct" data-v="${esc(a.name)}" aria-pressed="${a.key === typed}">${esc(a.name)}</button>`).join('')}</div>` : ''}
        <p class="hint new-acct" ${typed && !known ? '' : 'hidden'}>${typed && !known ? `“${esc(st.account.trim())}” will be added as a new account.` : ''}</p>
        <label class="field"><span class="lb">Date</span><input class="input" type="date" name="date" value="${esc(st.date)}"></label>
        <div class="chips"><button class="chip" data-act="day" data-v="${t}" aria-pressed="${st.date === t}">Today</button><button class="chip" data-act="day" data-v="${y}" aria-pressed="${st.date === y}">Yesterday</button></div>
        <label class="field"><span class="lb">Remark</span><input class="input" name="remark" value="${esc(st.remark)}" placeholder="Optional, e.g. laptop EMI" autocomplete="off" enterkeyhint="done"></label>
        <p class="err" hidden></p>
        <div class="actions"><button class="btn primary" data-act="save">${edit ? 'Save changes' : 'Save'}</button></div>`;
    }
  });
  // keep the "new account" hint and chip highlight in step with typing, without re-drawing the form
  sh.el.addEventListener('input', e => {
    if (e.target.name !== 'account') return;
    const typed = st.account.trim().toLowerCase(), known = typed && model().some(a => a.key === typed);
    $$('[data-act=acct]', sh.el).forEach(c => c.setAttribute('aria-pressed', String(c.dataset.v.toLowerCase() === typed)));
    const hint = $('.new-acct', sh.el);
    hint.hidden = !(typed && !known);
    hint.textContent = typed && !known ? `“${st.account.trim()}” will be added as a new account.` : '';
  });
}

/* ---------- rename an account (moves all its entries and payments) ---------- */
function openRename(a, onDone) {
  const st = { name: a.name };
  const act = {
    close: () => sh.close(),
    save: () => {
      const name = st.name.trim().replace(/\s+/g, ' ');
      if (!name) return sh.error('Enter a name.');
      if (name === a.name) return sh.close();
      const other = model().find(x => x.key === name.toLowerCase() && x.key !== a.key);
      if (other && !confirm(`“${other.name}” already exists. Merge “${a.name}” into it?`)) return;
      const target = other ? other.name : name;
      const ops = [];
      a.entries.forEach(e => {
        ops.push({ op: 'upsert', table: 'Debts', row: { id: e.id, account: target } });
        e.payments.forEach(p => ops.push({ op: 'upsert', table: 'DebtPayments', row: { id: p.id, account: target } }));
      });
      sh.close();
      if (onDone) onDone(target.toLowerCase());
      commit(ops, other ? `Merged into ${target}` : `Renamed to ${target}`);
    }
  };
  const sh = sheet({
    state: st, act, enter: () => act.save(),
    after: api => { const i = $('[name=name]', api.el); if (i) setTimeout(() => i.focus(), 80); },
    view: () => `<div class="grab"></div><div class="sheet-head"><h2><span class="t">Rename account</span></h2>${closeBtn}</div>
      <label class="field"><span class="lb">Name</span><input class="input" name="name" value="${esc(st.name)}" autocomplete="off" enterkeyhint="done"></label>
      <p class="hint">Typing the name of another account merges the two.</p>
      <p class="err" hidden></p>
      <div class="actions"><button class="btn primary" data-act="save">Save</button></div>`
  });
}

/* ---------- settings ---------- */
function openSettings() {
  const st = { url: S.settings.url, key: S.settings.key, show: false, msg: '', bad: false };
  const act = {
    close: () => sh.close(),
    show: () => { st.show = !st.show; sh.draw(); },
    save: async () => {
      const url = st.url.trim(), key = st.key.trim();
      if (!url && !key) { S.settings = { url: '', key: '' }; localStorage.setItem(APP.settings, JSON.stringify(S.settings)); Object.assign(st, { msg: 'Disconnected. Changes now stay on this phone.', bad: false }); paintSync(); renderAll(); return sh.draw(); }
      if (!/^https:\/\/script\.google\.com\/\S+\/exec\/?$/.test(url)) { Object.assign(st, { msg: 'Paste the Web app URL from Apps Script. It starts with https://script.google.com/ and ends with /exec.', bad: true }); return sh.draw(); }
      if (!key) { Object.assign(st, { msg: 'Enter the passphrase you set in the Apps Script.', bad: true }); return sh.draw(); }
      S.settings = { url, key };
      localStorage.setItem(APP.settings, JSON.stringify(S.settings));
      Object.assign(st, { msg: 'Connecting…', bad: false }); sh.draw();
      S.sync.error = '';
      await pull();
      if (S.sync.error) Object.assign(st, { msg: S.sync.error, bad: true });
      else Object.assign(st, { msg: `Connected. ${plural(S.data.Debts.length, 'entry', 'entries')} in your sheet.`, bad: false });
      sh.draw();
    },
    sync: () => { if (connected()) pull(); },
    clear: () => {
      const n = S.outbox.length;
      if (!confirm(n ? `${plural(n, 'change has', 'changes have')} not reached your sheet yet and will be lost. Clear anyway?` : 'Remove the copy of your data on this phone? Your Google Sheet is not touched.')) return;
      S.data = { Debts: [], DebtPayments: [] }; S.outbox = []; S.lastSync = 0; S.writes++;
      save(); renderAll(); paintSync();
      toast('Cleared from this phone');
      if (connected()) pull();
    }
  };
  const sh = sheet({
    state: st, act, enter: () => act.save(),
    view: () => `<div class="grab"></div>
      <div class="sheet-head"><h2><span class="t">Settings</span></h2>${closeBtn}</div>
      <h3 class="sec">Google Sheet</h3>
      <label class="field"><span class="lb">Apps Script web app URL</span><input class="input" name="url" value="${esc(st.url)}" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="url"></label>
      <label class="field"><span class="lb">Passphrase</span><span class="pw"><input class="input" name="key" type="${st.show ? 'text' : 'password'}" value="${esc(st.key)}" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="link-btn" data-act="show">${st.show ? 'Hide' : 'Show'}</button></span></label>
      <p class="${st.bad ? 'err' : 'okmsg'}" ${st.msg ? '' : 'hidden'}>${esc(st.msg)}</p>
      <div class="actions"><button class="btn primary" data-act="save">Save and connect</button></div>
      <div class="sync-info" id="syncInfo">${syncInfoHtml()}</div>
      <button class="btn ghost wide" data-act="sync">Sync now</button>
      <h3 class="sec">This phone</h3>
      <p class="hint">A copy of your debts is kept here so the app opens instantly and works offline.</p>
      <button class="btn ghost wide" data-act="clear">Clear data on this phone</button>`
  });
}

/* ---------- wiring ---------- */
function init() {
  load();
  $('.top').addEventListener('click', e => {
    const b = e.target.closest('[data-h]');
    if (!b) return;
    if (b.dataset.h === 'settings') openSettings();
    else if (b.dataset.h === 'sync') { if (!connected() || S.sync.error) openSettings(); else pull(); }
  });
  $('.xfab').addEventListener('click', () => openDebt());
  const acts = { acct: b => openAccount(b.dataset.key), settings: () => openSettings() };
  $('#main').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && acts[b.dataset.act]) acts[b.dataset.act](b); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - S.lastPull > 30000) pull(); });
  addEventListener('online', () => flush());
  renderAll(); paintSync();
  pull();
}
init();
</script>
