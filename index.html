<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Money">
<title>Money</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231c2028'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='%23fff' font-family='system-ui,sans-serif' font-weight='700'%3E%E2%82%B9%3C/text%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light;
  --plane:#f1f2ee;--surface:#fcfcfb;--raised:#ffffff;
  --ink:#1c2028;--ink-2:#585d68;--muted:#80858e;
  --hair:#e3e4df;--base:#c5c7c0;--chip:#e9eae5;
  --exp:#eb6834;--exp-txt:#b2441a;--exp-track:#f8ddd0;
  --inc:#1baf7a;--inc-txt:#0b7a51;
  --good:#0ca30c;--good-txt:#006300;--warn:#fab219;--crit:#d03b3b;--crit-txt:#b42323;
  --other:#b9b8b0;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;
  --fab:#1c2028;--fab-ink:#ffffff;--focus:#2a78d6;
  --scrim:rgba(20,22,26,.45);--shadow:0 8px 24px rgba(20,22,26,.16);
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --plane:#0f0f0e;--surface:#1a1a19;--raised:#242422;
  --ink:#f0efec;--ink-2:#c3c2b7;--muted:#94938c;
  --hair:#2c2c2a;--base:#4a4a44;--chip:#2a2a27;
  --exp:#d95926;--exp-txt:#f28b5e;--exp-track:#3b2419;
  --inc:#199e70;--inc-txt:#45cb96;
  --good-txt:#0ca30c;--crit-txt:#ff7b7b;
  --other:#5a5954;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;
  --fab:#f0efec;--fab-ink:#1a1a19;--focus:#6aa5f0;
  --scrim:rgba(0,0,0,.6);--shadow:0 8px 24px rgba(0,0,0,.55);
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--plane)}
body{color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.exp{color:var(--exp-txt)}.inc{color:var(--inc-txt)}.neg{color:var(--crit-txt)}
.app{max-width:560px;margin:0 auto;height:100%;height:100dvh;display:flex;flex-direction:column;background:var(--plane)}
@media (min-width:600px){.app{border-inline:1px solid var(--hair)}}
main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:24px}

/* header */
.top{flex:none;background:var(--surface);border-bottom:1px solid var(--hair);padding:calc(env(safe-area-inset-top) + 6px) 12px 14px}
.topbar{display:flex;align-items:center;gap:2px;min-height:44px}
.icon-btn{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:active{background:var(--chip)}
.icon-btn svg{width:22px;height:22px}
.month{position:relative;font-size:19px;font-weight:700;letter-spacing:-.01em;padding:6px 4px;white-space:nowrap}
.month input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;cursor:pointer}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;background:var(--chip);color:var(--ink-2);font-size:13px;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill[data-state=ok] i{background:var(--good)}
.pill[data-state=wait] i{background:var(--warn)}
.pill[data-state=err] i{background:var(--crit)}
.pill[data-state=busy] i{animation:blink .8s ease-in-out infinite alternate}
@keyframes blink{to{opacity:.2}}
.totals{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px;margin:8px 4px 0;align-items:end}
.tot{min-width:0}
.tot .lbl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.key{flex:none;width:9px;height:9px;border-radius:3px}
.key.exp{background:var(--exp)}.key.inc{background:var(--inc)}
.tot .val{display:block;font-size:17px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tot.hero .val{font-size:clamp(22px,7.2vw,30px);font-weight:750;letter-spacing:-.02em;line-height:1.15}
.meter{height:8px;margin:12px 4px 0;border-radius:99px;background:var(--exp-track);overflow:hidden}
.meter>span{display:block;height:100%;width:0;background:var(--exp);border-radius:99px;transition:width .35s ease}
.meter.over>span{background:var(--crit)}
.meter-note{margin:6px 4px 0;font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.meter-note svg{width:16px;height:16px;color:var(--crit-txt)}

/* day list */
.day-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;margin:0;padding:12px 16px 8px;background:var(--plane);font-weight:400}
.dnum{font-size:24px;font-weight:750;min-width:28px;letter-spacing:-.02em;line-height:1}
.dmeta{display:flex;flex-direction:column;line-height:1.2}
.dmeta b{font-size:14px;font-weight:600}
.dmeta small{font-size:12px;color:var(--ink-2)}
.dsum{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;font-size:13px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.3}
.list{list-style:none;margin:0 12px;padding:0;background:var(--surface);border:1px solid var(--hair);border-radius:16px;overflow:hidden}
.list.flush{margin:12px 0 0}
.list>li+li{border-top:1px solid var(--hair)}
.tx{width:100%;display:flex;align-items:center;gap:12px;padding:9px 12px;min-height:58px;text-align:left}
.tx:active{background:var(--chip)}
.ic{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;line-height:1;background:var(--chip)}
.ic.sm{width:32px;height:32px;border-radius:10px;font-size:17px}
.tx-main{flex:1;min-width:0;display:flex;flex-direction:column}
.tx-cat{font-weight:600}
.tx-note{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding:44px 24px;text-align:center;color:var(--ink-2)}
.empty.slim{padding:20px 8px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.notice{margin:12px 12px 0;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--hair);display:flex;align-items:center;gap:12px}
.notice p{margin:0;flex:1;font-size:14px;color:var(--ink-2)}
.notice b{color:var(--ink)}

/* bottom nav */
.nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:var(--surface);border-top:1px solid var(--hair);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;font-size:12px;color:var(--muted);border-radius:12px}
.nav-btn svg{width:24px;height:24px}
.nav-btn[aria-current=page]{color:var(--ink);font-weight:700}
.fab{justify-self:center;width:58px;height:58px;border-radius:20px;background:var(--fab);color:var(--fab-ink);display:grid;place-items:center;margin-top:-30px;box-shadow:var(--shadow)}
.fab svg{width:28px;height:28px}
.fab:active{transform:scale(.96)}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .2s}
.sheet{position:relative;width:100%;max-width:560px;max-height:94%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:22px 22px 0 0;padding:6px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet-wrap.open .scrim{opacity:1}
.sheet-wrap.open .sheet{transform:none}
@media (prefers-reduced-motion:reduce){.scrim,.sheet,.meter>span{transition:none}}
.grab{width:38px;height:4px;border-radius:4px;background:var(--hair);margin:4px auto 6px}
.sheet-head{display:flex;align-items:center;gap:6px;min-height:46px}
.sheet-head h2{margin:0;flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:18px;font-weight:750}
.sheet-head h2 .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{flex:none;font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--ink-2)}
.sec{margin:24px 0 2px;font-size:15px;font-weight:750}
.hint{margin:8px 0 0;font-size:13px;color:var(--ink-2)}

/* forms */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;border-radius:13px;background:var(--chip)}
.seg button{height:38px;border-radius:10px;font-weight:650;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--raised);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.field{display:block;margin-top:14px}
.field .lb{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px}
.input{width:100%;height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--hair);background:var(--raised);font-size:16px;outline:none}
.input:focus{border-color:var(--focus);box-shadow:0 0 0 1px var(--focus)}
.money-in{display:flex;align-items:center;gap:4px;height:66px;padding:0 14px;border-radius:14px;border:1px solid var(--hair);background:var(--raised)}
.money-in:focus-within{border-color:var(--focus);box-shadow:0 0 0 1px var(--focus)}
.money-in .cur{font-size:26px;font-weight:650;color:var(--ink-2)}
.money-in input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;font-size:32px;font-weight:750;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{height:34px;padding:0 13px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:650;color:var(--ink-2)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.btn{height:50px;border-radius:14px;padding:0 18px;font-size:16px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--fab);color:var(--fab-ink);flex:1}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.danger{color:var(--crit-txt)}
.btn.wide{width:100%;margin-top:10px}
.btn.small{height:38px;padding:0 14px;border-radius:11px;font-size:14px}
.actions{display:flex;gap:10px;margin-top:20px}
.err{margin:10px 0 0;font-size:14px;color:var(--crit-txt)}
.okmsg{margin:10px 0 0;font-size:14px;color:var(--good-txt)}
.link-btn{flex:none;height:32px;padding:0 11px;border-radius:9px;font-size:13px;font-weight:650;color:var(--ink-2);background:var(--chip)}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:12px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;padding:8px 2px 6px;border-radius:14px;font-size:12px;font-weight:550;text-align:center;line-height:1.2}
.cat>span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;letter-spacing:-.01em}
.cat .ic{width:48px;height:48px;border-radius:16px;font-size:23px}
.cat[aria-pressed=true] .ic{box-shadow:0 0 0 2px var(--ink)}
.cat:active{background:var(--chip)}
.cat.add .ic{background:none;border:1.5px dashed var(--base);color:var(--ink-2);font-size:24px}
.managing .cat:not(.add) .ic{box-shadow:0 0 0 1.5px var(--base)}
.emoji-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.emoji-grid button{height:42px;border-radius:12px;font-size:21px;background:var(--chip)}
.emoji-grid button[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink)}
.pw{display:flex;gap:8px;align-items:center}
.pw .input{flex:1}
.sync-info{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--plane);font-size:13px;color:var(--ink-2)}
.sync-info p{margin:0}
.sync-info p+p{margin-top:4px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:16px;width:max-content;max-width:calc(100% - 32px);padding:11px 14px;border-radius:12px;background:var(--ink);color:var(--surface);font-size:14px;box-shadow:var(--shadow)}
.toast.at-top{top:calc(env(safe-area-inset-top) + 12px);bottom:auto}
.toast button{color:inherit;font-weight:750;text-decoration:underline;text-underline-offset:3px}

/* charts & reports */
.stack{display:grid;gap:12px;padding:12px}
.card{position:relative;min-width:0;background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:14px}
.card-head{display:flex;align-items:flex-start;gap:8px}
.card-head>div{flex:1;min-width:0}
.card h3{margin:0;font-size:15px;font-weight:750}
.card .sub{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 0 0;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lk{flex:none;width:14px;height:2px;border-radius:2px}
.bk{flex:none;width:10px;height:10px;border-radius:3px}
.chart-box{position:relative;margin-top:6px}
svg.chart{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y;outline:none;-webkit-user-select:none;user-select:none}
svg.chart:focus-visible{outline:2px solid var(--focus);outline-offset:4px;border-radius:8px}
.chart .grid{stroke:var(--hair);stroke-width:1}
.chart .axis{stroke:var(--base);stroke-width:1}
.chart text{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.chart text.val{fill:var(--ink-2);font-size:12px;font-weight:650}
.chart .line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{stroke:var(--surface);stroke-width:2}
.chart .xline{stroke:var(--muted);stroke-width:1}
.chart .bars g{transition:opacity .12s}
.chart.hover .bars g:not(.on){opacity:.4}
svg.donut{width:184px;margin:8px auto 0}
.donut .seg{stroke:var(--surface);stroke-width:2;transition:opacity .12s}
.donut.hover .seg:not(.on){opacity:.35}
.donut text{pointer-events:none}
.donut text.c1{fill:var(--ink);font-size:19px;font-weight:750;font-variant-numeric:normal}
.donut text.c2{fill:var(--ink-2);font-size:12px}
.tip{position:absolute;top:0;left:0;z-index:5;min-width:130px;padding:8px 10px;border-radius:10px;background:var(--raised);border:1px solid var(--hair);box-shadow:var(--shadow);font-size:13px;pointer-events:none}
.tip .t{font-size:12px;color:var(--ink-2);margin-bottom:3px}
.tip .r{display:flex;align-items:center;gap:8px;white-space:nowrap;line-height:1.55}
.tip .r i{flex:none;width:12px;height:2px;border-radius:2px}
.tip .r b{font-weight:750;font-variant-numeric:tabular-nums}
.tip .r span{color:var(--ink-2)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{min-width:0;background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:12px 14px}
.kpi .k{font-size:13px;color:var(--ink-2)}
.kpi .v{display:flex;align-items:center;gap:4px;margin-top:2px;font-size:20px;font-weight:750;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v svg{width:18px;height:18px}
.kpi .d{margin-top:2px;font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up{color:var(--crit-txt)}.down{color:var(--good-txt)}
.cat-rows{list-style:none;margin:10px 0 0;padding:0}
.cat-row{width:100%;display:grid;grid-template-columns:10px 30px minmax(0,1fr) auto;grid-template-areas:"sw ic nm am" ". . cbar cbar";align-items:center;column-gap:9px;row-gap:6px;padding:9px 2px;text-align:left;border-top:1px solid var(--hair)}
.cat-rows li:first-child .cat-row{border-top:0}
.cat-row:active{background:var(--chip)}
.cat-row .bk{grid-area:sw}
.cat-row .ic{grid-area:ic;width:30px;height:30px;border-radius:10px;font-size:16px}
.cat-row .nm{grid-area:nm;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-row .nm small{font-weight:400;font-size:13px;color:var(--ink-2);margin-left:6px}
.cat-row .am{grid-area:am;font-weight:650;font-variant-numeric:tabular-nums}
.cat-row .cbar{grid-area:cbar;height:4px;border-radius:4px;background:var(--chip);overflow:hidden}
.cat-row .cbar span{display:block;height:100%;border-radius:4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;margin-top:8px}
.tbl th{font-weight:650;color:var(--ink-2);text-align:right;padding:6px 4px;border-bottom:1px solid var(--hair)}
.tbl td{text-align:right;padding:9px 4px;border-bottom:1px solid var(--hair);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr.tot td{font-weight:750;border-bottom:0}
.tbl tr[data-act]{cursor:pointer}
.tbl tr[data-act]:active td,.tbl tr.sel td{background:var(--chip)}
.tbl-wrap{overflow-x:auto}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:2px 0}
.weeks{list-style:none;margin:6px 0 0;padding:0}
.week{padding:11px 0;border-top:1px solid var(--hair)}
.week:first-child{border-top:0}
.week .w1{display:flex;justify-content:space-between;gap:10px;font-weight:650}
.week .w2{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:3px;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="topbar">
      <button class="icon-btn" data-h="prev" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <label class="month"><span id="monthName"></span><input id="monthPick" type="month" aria-label="Choose month"></label>
      <button class="icon-btn" data-h="next" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      <span class="spacer"></span>
      <button class="pill" id="syncPill" data-h="sync"><i></i><span></span></button>
    </div>
    <div class="totals">
      <div class="tot hero"><span class="lbl"><i class="key exp"></i>Spent</span><span class="val" id="tSpent"></span></div>
      <div class="tot"><span class="lbl"><i class="key inc"></i>Earned</span><span class="val" id="tEarned"></span></div>
      <div class="tot"><span class="lbl">Balance</span><span class="val" id="tBal"></span></div>
    </div>
    <div class="meter" id="meter" role="img"><span></span></div>
    <p class="meter-note" id="meterNote"></p>
  </header>
  <main id="main"></main>
  <nav class="nav" aria-label="Main">
    <button class="nav-btn" data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
    <button class="nav-btn" data-tab="charts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18M6 20v-6M11 20V6M16 20v-9M21 4l-5 4-5-3-5 5"/></svg><span>Charts</span></button>
    <button class="fab" data-n="add" aria-label="Add entry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="nav-btn" data-tab="reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg><span>Reports</span></button>
    <button class="nav-btn" data-n="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span>Settings</span></button>
  </nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
'use strict';
/* =====================================================================
   Money tracker. Data lives in your Google Sheet (via the Apps Script in
   Code.gs) with a copy on this phone, so it opens instantly and works
   offline. Changes made offline upload automatically later.
   ===================================================================== */
const APP = { store: 'money.v1', settings: 'money.settings', alt: 'debt.settings', tables: ['Transactions', 'Categories'] };

const DEFAULT_CATS = [
  ['expense', 'Miscellaneous', '🧩'], ['expense', 'Bills', '🧾'], ['expense', 'Home', '🏠'], ['expense', 'Grocery', '🛒'],
  ['expense', 'Shopping', '🛍️'], ['expense', 'Food', '🍔'], ['expense', 'Entertainment', '🎬'], ['expense', 'Beauty', '💄'],
  ['expense', 'Social', '🥂'], ['expense', 'Transportation', '🛺'], ['expense', 'Travel', '✈️'], ['expense', 'Health', '💊'],
  ['expense', 'Repairs', '🔧'], ['expense', 'Gifts', '🎁'],
  ['income', 'STR', '💼'], ['income', 'Pay', '💵'], ['income', 'Salary', '🏦'], ['income', 'Investment', '📈'], ['income', 'Bonus', '⭐']
].map(([type, name, icon]) => ({ id: `def-${type}-${name.toLowerCase()}`, type, name, icon }));

const EMOJIS = ['🧩','🧾','🏠','🛒','🛍️','🍔','🎬','💄','🥂','🛺','✈️','💊','🔧','🎁','💼','💵','🏦','📈','⭐','☕','🍕','⛽','🚗','🚆','📱','💡','💧','📚','🎓','👶','🐾','👕','🏋️','🎮','🏥','💳','🏷️','🎉','🪙','📦','🙏','🧹'];

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const isYmd = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const daysIn = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const shiftMonth = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MON = MONTHS.map(m => m.slice(0, 3));
const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const monthName = ym => { const [y, m] = ym.split('-').map(Number); return `${MONTHS[m - 1]} ${y}`; };
const fmtDate = s => { if (!isYmd(s)) return 'No date'; const d = parseD(s); return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const round2 = n => Math.round(n * 100) / 100;
const toNum = v => { const n = typeof v === 'number' ? v : parseFloat(String(v ?? '').replace(/[^0-9.\-]/g, '')); return Number.isFinite(n) ? n : 0; };
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const nf0 = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function inr(n, signed) {
  const a = round2(Math.abs(n)), body = '₹' + (a % 1 ? nf2.format(a) : nf0.format(a));
  if (signed) return (n < 0 ? '−' : n > 0 ? '+' : '') + body;
  return (n < 0 ? '−' : '') + body;
}
function inrShort(n) {
  const a = Math.abs(n), s = n < 0 ? '−' : '';
  const f = (v, u, dp) => `${s}₹${(Math.round(v * 10 ** dp) / 10 ** dp).toString()}${u}`;
  if (a >= 1e7) return f(a / 1e7, 'Cr', 2);
  if (a >= 1e5) return f(a / 1e5, 'L', 2);
  if (a >= 1e3) return f(a / 1e3, 'K', 1);
  return `${s}₹${Math.round(a)}`;
}
const fmtPct = p => (p > 0 && p < 1 ? '<1%' : Math.round(p) + '%');
const ICONS = {
  close: '<path d="M6 6l12 12M18 6 6 18"/>', back: '<path d="M15 5l-7 7 7 7"/>',
  warn: '<path d="M12 4 2.8 19.5h18.4z"/><path d="M12 10v4.2M12 17v.01"/>',
  up: '<path d="M12 19V5M6 11l6-6 6 6"/>', down: '<path d="M12 5v14M6 13l6 6 6-6"/>'
};
const icon = n => `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
const closeBtn = `<button class="icon-btn" data-act="close" aria-label="Close">${icon('close')}</button>`;

/* ---------- state ---------- */
const S = {
  data: { Transactions: [], Categories: [] }, outbox: [], lastSync: 0,
  settings: { url: '', key: '' }, sync: { busy: false, pulling: false, error: '' },
  month: today().slice(0, 7), tab: 'home', writes: 0, lastPull: 0,
  lastType: 'expense', lastDate: null, rmode: 'monthly', ryear: null, tables: {}
};

const NORM = {
  Transactions: r => ({
    id: String(r.id ?? ''), date: normDate(r.date), type: /^inc/i.test(String(r.type ?? '')) ? 'income' : 'expense',
    category: String(r.category ?? '').trim() || 'Miscellaneous', amount: Math.abs(toNum(r.amount)), note: String(r.note ?? '').trim()
  }),
  Categories: r => ({
    id: String(r.id ?? ''), type: /^inc/i.test(String(r.type ?? '')) ? 'income' : 'expense',
    name: String(r.name ?? '').trim(), icon: String(r.icon ?? '').trim()
  })
};
function normDate(v) {
  const s = String(v ?? '').trim(), m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  const d = new Date(s);
  return isNaN(d) ? '' : ymd(d);
}
function normalizeAll(d) {
  const o = {};
  APP.tables.forEach(t => { o[t] = (Array.isArray(d[t]) ? d[t] : []).map(NORM[t]).filter(r => r.id && (t !== 'Categories' || r.name)); });
  return o;
}

function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(APP.store) || 'null');
    if (raw) { S.data = normalizeAll(raw.data || {}); S.outbox = Array.isArray(raw.outbox) ? raw.outbox : []; S.lastSync = raw.lastSync || 0; }
  } catch (e) { /* unreadable cache: start fresh, the sheet still has everything */ }
  try {
    let st = JSON.parse(localStorage.getItem(APP.settings) || 'null');
    if (!st) { // reuse the debt tracker's connection when both apps are on the same site
      st = JSON.parse(localStorage.getItem(APP.alt) || 'null');
      if (st && st.url) localStorage.setItem(APP.settings, JSON.stringify(st));
    }
    if (st) S.settings = { url: st.url || '', key: st.key || '' };
  } catch (e) {}
  if (!S.data.Categories.length && !S.lastSync) S.data.Categories = DEFAULT_CATS.map(c => ({ ...c }));
}
function save() {
  try { localStorage.setItem(APP.store, JSON.stringify({ data: S.data, outbox: S.outbox, lastSync: S.lastSync })); }
  catch (e) { toast('This phone’s storage is full. Entries still go to your sheet.'); }
}

/* ---------- sync with the Google Sheet ---------- */
const connected = () => !!(S.settings.url && S.settings.key);

async function api(body) {
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 45000);
  try {
    const res = await fetch(S.settings.url, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ ...body, key: S.settings.key }), signal: ctrl.signal, redirect: 'follow'
    });
    const text = await res.text();
    let json;
    try { json = JSON.parse(text); } catch (e) { throw new Error(res.ok ? 'That URL did not answer like the Apps Script. Check it in Settings.' : `Google returned error ${res.status}.`); }
    if (!json.ok) throw new Error(json.error || 'The sheet refused the request.');
    return json;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('No reply from Google. Check your connection.');
    if (e instanceof TypeError) throw new Error('Could not reach Google. You may be offline, or the deployment is not set to “Anyone”.');
    throw e;
  } finally { clearTimeout(timer); }
}

function applyLocal(op) {
  const arr = S.data[op.table];
  if (!arr) return;
  const id = op.op === 'delete' ? op.id : op.row && op.row.id;
  const i = arr.findIndex(r => r.id === id);
  if (op.op === 'delete') { if (i >= 0) arr.splice(i, 1); return; }
  if (i >= 0) arr[i] = NORM[op.table]({ ...arr[i], ...op.row });
  else arr.push(NORM[op.table]({ ...op.row }));
}

function commit(ops, msg, undoOps) {
  ops.forEach(op => { op.opId = uid(); applyLocal(op); S.outbox.push(op); });
  S.writes++;
  save(); renderAll(); flush();
  if (msg) toast(msg, undoOps ? () => commit(undoOps, 'Restored') : null);
}

let flushing = null, retryTimer = null;
function flush() { if (!flushing) flushing = doFlush().finally(() => { flushing = null; }); return flushing; }
async function doFlush() {
  if (!connected() || !S.outbox.length) { paintSync(); return; }
  S.sync.busy = true; paintSync();
  try {
    while (S.outbox.length) {
      const batch = S.outbox.slice(0, 400);
      await api({ action: 'apply', ops: batch.map(({ opId, ...o }) => o) });
      const done = new Set(batch.map(o => o.opId));
      S.outbox = S.outbox.filter(o => !done.has(o.opId));
      save();
    }
    S.sync.error = ''; S.lastSync = Date.now(); save();
  } catch (e) {
    S.sync.error = e.message;
    clearTimeout(retryTimer); retryTimer = setTimeout(flush, 30000);
  } finally { S.sync.busy = false; paintSync(); }
}

let pulling = null;
function pull() { if (!pulling) pulling = doPull().finally(() => { pulling = null; }); return pulling; }
async function doPull() {
  if (!connected()) { paintSync(); return; }
  S.lastPull = Date.now();
  await flush();
  if (S.outbox.length) return; // could not upload; keep showing the local copy
  const w = S.writes;
  S.sync.pulling = true; paintSync();
  try {
    const res = await api({ action: 'get', tables: APP.tables });
    if (w !== S.writes) return; // edited meanwhile: the local copy is newer, refresh next time
    S.data = normalizeAll(res.data || {});
    S.outbox.forEach(applyLocal);
    S.lastSync = Date.now(); S.sync.error = '';
    save(); renderAll();
  } catch (e) { S.sync.error = e.message; }
  finally { S.sync.pulling = false; paintSync(); }
}

function timeAgo(t) {
  const s = (Date.now() - t) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  const d = new Date(t), hm = d.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
  return ymd(d) === today() ? `at ${hm}` : `${fmtDate(ymd(d))}, ${hm}`;
}
function syncInfoHtml() {
  if (!connected()) return '<p>Not connected. Entries stay on this phone until you connect.</p>';
  const p = [S.lastSync ? `Last synced ${timeAgo(S.lastSync)}.` : 'Not synced yet.'];
  if (S.outbox.length) p.push(`${plural(S.outbox.length, 'change', 'changes')} waiting to upload.`);
  if (S.sync.error) p.push(`Last problem: ${S.sync.error}`);
  return p.map(x => `<p>${esc(x)}</p>`).join('');
}
function paintSync() {
  const pill = $('#syncPill');
  let state = 'ok', text = 'Synced';
  if (!connected()) { state = 'off'; text = 'Not connected'; }
  else if (S.sync.busy || S.sync.pulling) { state = 'busy'; text = 'Syncing'; }
  else if (S.sync.error) { state = 'err'; text = S.outbox.length ? `${S.outbox.length} not synced` : 'Sync failed'; }
  else if (S.outbox.length) { state = 'wait'; text = `${S.outbox.length} waiting`; }
  pill.dataset.state = state;
  pill.lastElementChild.textContent = text;
  pill.setAttribute('aria-label', `Sync status: ${text}`);
  const info = $('#syncInfo');
  if (info) info.innerHTML = syncInfoHtml();
}

/* ---------- layers (sheets) + Android back button ---------- */
const layers = [], openSheets = [];
let pendingBack = 0;
function pushLayer(close) { layers.push(close); history.pushState({ layer: layers.length }, ''); }
function popLayer() { if (layers.length > pendingBack) { pendingBack++; history.back(); } }
addEventListener('popstate', () => { if (pendingBack) pendingBack--; const close = layers.pop(); if (close) close(); });

function sheet({ view, act = {}, state, after, live, enter }) {
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  wrap.innerHTML = '<div class="scrim"></div><section class="sheet" role="dialog" aria-modal="true"></section>';
  const el = wrap.lastElementChild;
  const api = {
    el, live,
    draw() { const y = el.scrollTop; el.innerHTML = view(); el.scrollTop = y; if (after) after(api); },
    close: popLayer,
    error(msg) { const e = $('.err', el); if (e) { e.textContent = msg; e.hidden = false; } }
  };
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (b && el.contains(b) && act[b.dataset.act]) { e.preventDefault(); act[b.dataset.act](b, e); }
  });
  if (state) {
    const sync = e => {
      const n = e.target.name;
      if (n && n in state) state[n] = e.target.value;
      // keep quick-pick chips in step with what was typed or picked by hand
      if (n === 'date') $$('[data-act=day]', el).forEach(c => c.setAttribute('aria-pressed', String(c.dataset.v === e.target.value)));
      if (n === 'amount') $$('[data-act=fill]', el).forEach(c => c.setAttribute('aria-pressed', String(toNum(e.target.value) === toNum(c.dataset.v))));
    };
    el.addEventListener('input', sync); el.addEventListener('change', sync);
  }
  el.addEventListener('keydown', e => { if (e.key === 'Enter' && enter && e.target.matches('input')) { e.preventDefault(); enter(e.target); } });
  wrap.firstElementChild.addEventListener('click', popLayer);
  document.body.appendChild(wrap);
  openSheets.push(api);
  api.draw();
  requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('open')));
  pushLayer(() => {
    openSheets.splice(openSheets.indexOf(api), 1);
    wrap.classList.remove('open');
    setTimeout(() => wrap.remove(), 280);
  });
  return api;
}

let toastTimer;
function toast(msg, undo) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button">Undo</button>' : ''}`;
  t.classList.toggle('at-top', layers.length - pendingBack > 0); // a sheet is still open: keep its content clear
  t.hidden = false;
  if (undo) t.querySelector('button').onclick = () => { t.hidden = true; undo(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, undo ? 5000 : 2400);
}

/* ---------- data views ---------- */
const cats = () => (S.data.Categories.length ? S.data.Categories : DEFAULT_CATS);
function catInfo(type, name) {
  const n = String(name || '').toLowerCase();
  const c = cats().find(x => x.type === type && x.name.toLowerCase() === n);
  const shown = c ? c.name : String(name || 'Miscellaneous');
  return { key: shown.toLowerCase(), name: shown, icon: (c && c.icon) || shown.charAt(0).toUpperCase() };
}
const findTx = id => S.data.Transactions.find(t => t.id === id);
function monthTx(ym) {
  const out = [];
  S.data.Transactions.forEach((t, i) => { if (t.date.slice(0, 7) === ym) out.push({ ...t, _i: i }); });
  return out;
}
const byNewest = (a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b._i - a._i);
function totals(list) {
  let inc = 0, exp = 0;
  for (const t of list) { if (t.type === 'income') inc += t.amount; else exp += t.amount; }
  return { inc: round2(inc), exp: round2(exp) };
}
function breakdown(type, list) {
  const m = new Map();
  for (const t of list) {
    if (t.type !== type) continue;
    const c = catInfo(type, t.category), e = m.get(c.key) || { ...c, value: 0, n: 0 };
    e.value += t.amount; e.n++; m.set(c.key, e);
  }
  return [...m.values()].sort((a, b) => b.value - a.value);
}
// The five biggest categories of all time keep the same chart colour every month.
function slotMap(type) {
  const m = {};
  breakdown(type, S.data.Transactions).slice(0, 5).forEach((c, i) => { m[c.key] = 's' + (i + 1); });
  return m;
}
function defaultDate() {
  const now = today();
  if (S.month === now.slice(0, 7)) return now;
  if (S.lastDate && S.lastDate.slice(0, 7) === S.month) return S.lastDate;
  return S.month > now.slice(0, 7) ? `${S.month}-01` : `${S.month}-${pad(daysIn(S.month))}`;
}

/* ---------- rendering ---------- */
function renderAll() { renderHeader(); renderTab(); openSheets.forEach(s => { if (s.live) s.draw(); }); }

function renderHeader() {
  $('#monthName').textContent = monthName(S.month);
  $('#monthPick').value = S.month;
  const t = totals(monthTx(S.month)), bal = round2(t.inc - t.exp);
  $('#tSpent').textContent = inr(t.exp);
  $('#tEarned').textContent = inr(t.inc);
  const b = $('#tBal'); b.textContent = inr(bal); b.classList.toggle('neg', bal < 0);
  const meter = $('#meter'), note = $('#meterNote');
  meter.hidden = !(t.inc > 0);
  if (t.inc > 0) {
    const pct = t.exp / t.inc, over = pct > 1;
    meter.classList.toggle('over', over);
    meter.firstElementChild.style.width = Math.min(100, pct * 100).toFixed(1) + '%';
    meter.setAttribute('aria-label', `${Math.round(pct * 100)}% of earnings spent`);
    note.innerHTML = over ? `${icon('warn')}<span>Spent ${inr(t.exp - t.inc)} more than earned</span>` : `<span>${fmtPct(pct * 100)} of earnings spent</span>`;
  } else {
    note.innerHTML = `<span>${t.exp > 0 ? 'No earnings recorded this month' : 'Nothing recorded yet'}</span>`;
  }
}

function renderTab() {
  ({ home: renderHome, charts: renderCharts, reports: renderReports })[S.tab]();
  $$('.nav [data-tab]').forEach(b => b.setAttribute('aria-current', b.dataset.tab === S.tab ? 'page' : 'false'));
}

function txRow(t, withDate) {
  const c = catInfo(t.type, t.category), inc = t.type === 'income';
  const sub = withDate ? fmtDate(t.date) + (t.note ? `, ${t.note}` : '') : t.note;
  return `<li><button class="tx" data-act="tx" data-id="${esc(t.id)}"><span class="ic">${esc(c.icon)}</span><span class="tx-main"><span class="tx-cat">${esc(c.name)}</span>${sub ? `<span class="tx-note">${esc(sub)}</span>` : ''}</span><span class="amt ${inc ? 'inc' : 'exp'}">${inc ? '+' : '−'}${inr(t.amount)}</span></button></li>`;
}

function renderHome() {
  const list = monthTx(S.month).sort(byNewest), days = new Map();
  for (const t of list) { if (!days.has(t.date)) days.set(t.date, []); days.get(t.date).push(t); }
  let h = '';
  if (!connected()) h += `<div class="notice"><p><b>Connect your Google Sheet.</b> Until then, entries stay on this phone.</p><button class="btn ghost small" data-act="settings">Connect</button></div>`;
  if (!list.length) h += `<div class="empty"><b>No entries in ${esc(monthName(S.month))}</b>Tap + to add an expense or income.</div>`;
  for (const [date, items] of days) {
    const t = totals(items);
    let head;
    if (isYmd(date)) {
      const d = parseD(date);
      head = `<span class="dnum">${d.getDate()}</span><span class="dmeta"><b>${WEEKDAYS[d.getDay()]}</b><small>${MON[d.getMonth()]} ${d.getFullYear()}</small></span>`;
    } else head = '<span class="dmeta"><b>No date</b></span>';
    h += `<section><h3 class="day-head">${head}<span class="dsum">${t.exp ? `<span class="exp">−${inr(t.exp)}</span>` : ''}${t.inc ? `<span class="inc">+${inr(t.inc)}</span>` : ''}</span></h3><ul class="list">${items.map(x => txRow(x)).join('')}</ul></section>`;
  }
  $('#main').innerHTML = h;
}

/* ---------- charts (hand-built SVG: thin marks, hairline grid, tap for values) ---------- */
const Charts = (() => {
  let active = null;
  document.addEventListener('pointerdown', e => { if (active && !active.box.contains(e.target)) { active.hide(); active = null; } }, true);

  function niceTicks(max) {
    if (!(max > 0)) return [0, 100];
    const raw = max / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), r = raw / mag;
    const step = (r <= 1 ? 1 : r <= 2 ? 2 : r <= 2.5 ? 2.5 : r <= 5 ? 5 : 10) * mag, out = [];
    for (let v = 0; v < max + step; v += step) out.push(round2(v));
    return out;
  }

const legend = items => `<div class="legend">${items.map(i => `<span><i class="${i.box ? 'bk' : 'lk'}" style="background:var(--${i.color})"></i>${esc(i.name)}</span>`).join('')}</div>`;

function renderCharts() {
  const ym = S.month, list = monthTx(ym), t = totals(list);
  const [, M] = ym.split('-').map(Number), nowYm = today().slice(0, 7), isCur = ym === nowYm, days = daysIn(ym);
  const elapsed = isCur ? +today().slice(8) : ym < nowYm ? days : 0;
  const prevYm = shiftMonth(ym, -1), pm = +prevYm.slice(5) - 1, prevList = monthTx(prevYm);
  const prevSame = totals(isCur ? prevList.filter(x => +x.date.slice(8) <= elapsed) : prevList).exp;
  const biggest = list.filter(x => x.type === 'expense').reduce((a, x) => (!a || x.amount > a.amount ? x : a), null);
  const saved = round2(t.inc - t.exp);

  let vs = '–', vsSub = `No spending in ${MONTHS[pm]}`;
  if (prevSame > 0) {
    const p = (t.exp - prevSame) / prevSame, up = p > 0;
    vs = Math.abs(p) < 0.005 ? 'Same' : `<span class="${up ? 'up' : 'down'}">${icon(up ? 'up' : 'down')}</span>${Math.round(Math.abs(p) * 100)}% ${up ? 'more' : 'less'}`;

  }

  h += kpi(`Spending vs ${MON[pm]}`, vs, vsSub);
  h += kpi('Saved', `<span class="${saved < 0 ? 'neg' : ''}">${inr(saved)}</span>`, t.inc > 0 ? `${Math.round((saved / t.inc) * 100)}% of earnings` : 'No earnings yet');
  h += kpi('Largest expense', biggest ? inr(biggest.amount) : '–', biggest ? `${esc(catInfo('expense', biggest.category).name)}, ${fmtDate(biggest.date).slice(0, -5)}` : 'None yet');
  h += '</div>';

  const inc = Array(days).fill(0), exp = Array(days).fill(0);
  list.forEach(x => { const d = +x.date.slice(8) - 1; if (d >= 0 && d < days) (x.type === 'income' ? inc : exp)[d] += x.amount; });
  const lastDay = isCur ? elapsed : days, cInc = [], cExp = [];
  let ri = 0, re = 0;
  for (let i = 0; i < days; i++) { ri += inc[i]; re += exp[i]; cInc.push(i < lastDay ? round2(ri) : null); cExp.push(i < lastDay ? round2(re) : null); }

  const ticks = [0, 7, 14, 21, 28].filter(i => i < days);
  const dayTitle = i => `${i + 1} ${MON[M - 1]}`;

  if (!list.length) {

  } else {

    let bal = 0;
    const ioRows = activeDays.map(i => { bal += inc[i] - exp[i]; return `<tr><td>${dayTitle(i)}</td><td>${inc[i] ? inr(inc[i]) : '–'}</td><td>${exp[i] ? inr(exp[i]) : '–'}</td><td class="${bal < 0 ? 'neg' : ''}">${inr(round2(bal))}</td></tr>`; });

/* ---------- reports ---------- */
function monthAgg() {
  const m = {};
  for (const t of S.data.Transactions) {
    if (!isYmd(t.date)) continue;
    const k = t.date.slice(0, 7), e = m[k] || (m[k] = { inc: 0, exp: 0, n: 0 });
    if (t.type === 'income') e.inc += t.amount; else e.exp += t.amount;

  }
  return m;
}

  for (let d = 1; d <= days; d++) if (parseD(`${ym}-${pad(d)}`).getDay() === 0 || d === days) { out.push([start, d]); start = d + 1; }
  return out;
}
function renderReports() {

    const months = Array.from({ length: 12 }, (_, i) => `${year}-${pad(i + 1)}`), rows = months.filter(k => agg[k]).reverse();
    const sum = rows.reduce((s, k) => ({ inc: s.inc + agg[k].inc, exp: s.exp + agg[k].exp }), { inc: 0, exp: 0 });
    h += `<div class="chiprow">${years.map(y => `<button class="chip" data-act="year" data-v="${y}" aria-pressed="${y === year}">${y}</button>`).join('')}</div>`;
    if (!rows.length) h += `<div class="card"><div class="empty slim"><b>No entries in ${year}</b>Pick another year above.</div></div>`;
    else {
      const saved = round2(sum.inc - sum.exp);
      h += `<div class="kpis">${kpi(`Earned in ${year}`, inr(round2(sum.inc)), plural(rows.length, 'month', 'months') + ' with entries')}${kpi(`Spent in ${year}`, inr(round2(sum.exp)), `Average ${inr(Math.round(sum.exp / rows.length))} a month`)}${kpi('Saved', `<span class="${saved < 0 ? 'neg' : ''}">${inr(saved)}</span>`, sum.inc > 0 ? `${Math.round((saved / sum.inc) * 100)}% of earnings` : 'No earnings recorded')}${kpi('Best month', (() => { const best = rows.reduce((a, k) => (!a || agg[k].inc - agg[k].exp > agg[a].inc - agg[a].exp ? k : a), null); return MONTHS[+best.slice(5) - 1]; })(), 'Most saved')}</div>`;
      const tRows = rows.map(k => { const e = agg[k], net = round2(e.inc - e.exp); return `<tr data-act="gomonth" data-v="${k}" class="${k === S.month ? 'sel' : ''}"><td>${MON[+k.slice(5) - 1]}</td><td>${inr(e.inc)}</td><td>${inr(e.exp)}</td><td class="${net < 0 ? 'neg' : ''}">${inr(net, true)}</td></tr>`; });
      tRows.push(`<tr class="tot"><td>Total</td><td>${inr(round2(sum.inc))}</td><td>${inr(round2(sum.exp))}</td><td class="${saved < 0 ? 'neg' : ''}">${inr(saved, true)}</td></tr>`);
      h += cardHtml('year', `${year} by month`, 'Tap a month to open it.', legend([{ name: 'Earned', color: 'inc', box: true }, { name: 'Spent', color: 'exp', box: true }]) + '<div class="chart-box" id="chYear"></div>' + tableHtml(['Month', 'Earned', 'Spent', 'Saved'], tRows));
      draw = () => Charts.columns($('#chYear'), { labels: MONTHS.map(m => m[0]), series: [{ name: 'Earned', color: 'inc', values: months.map(k => round2(agg[k] ? agg[k].inc : 0)) }, { name: 'Spent', color: 'exp', values: months.map(k => round2(agg[k] ? agg[k].exp : 0)) }], xTicks: [...Array(12).keys()], tipTitle: i => monthName(months[i]), label: `Earned and spent each month of ${year}` });
    }
  } else {
    const ym = S.month, list = monthTx(ym), nowYm = today().slice(0, 7);
    const weeks = weeksOf(ym).map(([a, b]) => {
      const items = list.filter(t => { const d = +t.date.slice(8); return d >= a && d <= b; });
      return { a, b, ...totals(items), top: breakdown('expense', items)[0], n: items.length };
    });
    const mon = MON[+ym.slice(5) - 1], started = ym < nowYm ? weeks : ym === nowYm ? weeks.filter(w => w.a <= +today().slice(8)) : [];
    const avg = started.length ? started.reduce((s, w) => s + w.exp, 0) / started.length : 0;
    if (!list.length) h += `<div class="card"><div class="empty slim"><b>No entries in ${esc(monthName(ym))}</b>Use the arrows at the top to pick another month.</div></div>`;
    else {
      const rows = weeks.map(w => `<li class="week"><div class="w1"><span>${w.a}–${w.b} ${mon}</span><span class="${w.inc - w.exp < 0 ? 'neg' : ''}">${inr(round2(w.inc - w.exp), true)}</span></div><div class="w2"><span>Spent ${inr(w.exp)}</span><span>Earned ${inr(w.inc)}</span>${w.top ? `<span>Top: ${esc(w.top.name)} ${inr(w.top.value)}</span>` : ''}<span>${plural(w.n, 'entry', 'entries')}</span></div></li>`).join('');
      h += cardHtml('weeks', `Weeks of ${monthName(ym)}`, `Average spend ${inr(Math.round(avg))} a week. Weeks run Monday to Sunday.`, legend([{ name: 'Earned', color: 'inc', box: true }, { name: 'Spent', color: 'exp', box: true }]) + '<div class="chart-box" id="chWeeks"></div>' + `<ul class="weeks">${rows}</ul>`);
      draw = () => Charts.columns($('#chWeeks'), { labels: weeks.map(w => `${w.a}–${w.b}`), series: [{ name: 'Earned', color: 'inc', values: weeks.map(w => w.inc) }, { name: 'Spent', color: 'exp', values: weeks.map(w => w.exp) }], xTicks: weeks.map((_, i) => i), tipTitle: i => `${weeks[i].a}–${weeks[i].b} ${mon}`, label: `Earned and spent each week of ${monthName(ym)}` });
    }
  }
  $('#main').innerHTML = h + '</div>';
  if (draw) draw();
}

/* ---------- add / edit an entry ---------- */
function openTx(tx) {
  const edit = !!tx;
  const st = {
    type: edit ? tx.type : S.lastType, category: edit ? catInfo(tx.type, tx.category).name : '',
    amount: edit ? String(tx.amount) : '', date: edit ? tx.date : defaultDate(), note: edit ? tx.note : '',
    step: edit ? 'form' : 'cats', manage: false
  };
  const act = {
    close: () => sh.close(),
    type: b => { st.type = b.dataset.v; sh.draw(); },
    manage: () => { st.manage = !st.manage; sh.draw(); },
    pick: b => {
      const c = cats().find(x => x.id === b.dataset.id);
      if (!c) return;
      if (st.manage) return openCategory(c, c.type, (name, old) => { if (old && st.category === old) st.category = name || ''; sh.draw(); });
      st.category = c.name; st.type = c.type; st.step = 'form'; sh.draw();
    },
    newcat: () => openCategory(null, st.type, name => { if (!st.manage) { st.category = name; st.step = 'form'; } sh.draw(); }),
    back: () => { st.step = 'cats'; sh.draw(); },
    day: b => { st.date = b.dataset.v; sh.draw(); },
    save: () => {
      const amount = round2(toNum(st.amount));
      if (!(amount > 0)) return sh.error('Enter an amount above zero.');
      if (!isYmd(st.date)) return sh.error('Choose a date.');
      const row = { id: edit ? tx.id : uid(), date: st.date, type: st.type, category: st.category, amount, note: st.note.trim() };
      S.lastType = st.type; S.lastDate = st.date;
      sh.close();
      const elsewhere = row.date.slice(0, 7) !== S.month ? ` to ${monthName(row.date.slice(0, 7))}` : '';
      commit([{ op: 'upsert', table: 'Transactions', row }], edit ? `Changes saved${elsewhere}` : `Saved${elsewhere}`);
    },
    del: () => {
      const before = { ...tx };
      sh.close();
      commit([{ op: 'delete', table: 'Transactions', id: tx.id }], 'Entry deleted', [{ op: 'upsert', table: 'Transactions', row: before }]);
    }
  };
  const sh = sheet({
    state: st, act,
    enter: el => { if (el.name === 'amount') { const n = $('[name=note]', sh.el); if (n) n.focus(); } else act.save(); },
    after: api => { if (st.step === 'form' && !st.amount) { const a = $('[name=amount]', api.el); if (a) setTimeout(() => a.focus(), 80); } },
    view: () => {
      if (st.step === 'cats') {
        const list = cats().filter(c => c.type === st.type);
        return `<div class="grab"></div>
          <div class="sheet-head"><h2><span class="t">${st.manage ? 'Edit categories' : edit ? 'Change category' : 'Add entry'}</span></h2><button class="link-btn" data-act="manage">${st.manage ? 'Done' : 'Edit'}</button>${closeBtn}</div>
          <div class="seg" role="group" aria-label="Entry type"><button data-act="type" data-v="expense" aria-pressed="${st.type === 'expense'}">Expense</button><button data-act="type" data-v="income" aria-pressed="${st.type === 'income'}">Income</button></div>
          ${st.manage ? '<p class="hint">Tap a category to rename it, change its icon or delete it.</p>' : ''}
          <div class="cat-grid${st.manage ? ' managing' : ''}">${list.map(c => `<button class="cat" data-act="pick" data-id="${esc(c.id)}" aria-pressed="${!st.manage && c.name === st.category}"><span class="ic">${esc(c.icon || c.name.charAt(0))}</span><span>${esc(c.name)}</span></button>`).join('')}<button class="cat add" data-act="newcat"><span class="ic">+</span><span>New</span></button></div>`;
      }
      const c = catInfo(st.type, st.category), t = today(), y = addDays(t, -1);
      return `<div class="grab"></div>
        <div class="sheet-head"><button class="icon-btn" data-act="back" aria-label="Change category">${icon('back')}</button><h2><span class="ic sm">${esc(c.icon)}</span><span class="t">${esc(c.name)}</span><span class="tag">${st.type === 'income' ? 'Income' : 'Expense'}</span></h2>${closeBtn}</div>
        <label class="field"><span class="lb">Amount</span><span class="money-in"><span class="cur">₹</span><input name="amount" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(st.amount)}" enterkeyhint="next" aria-label="Amount in rupees"></span></label>
        <label class="field"><span class="lb">Date</span><input class="input" type="date" name="date" value="${esc(st.date)}"></label>
        <div class="chips"><button class="chip" data-act="day" data-v="${t}" aria-pressed="${st.date === t}">Today</button><button class="chip" data-act="day" data-v="${y}" aria-pressed="${st.date === y}">Yesterday</button></div>
        <label class="field"><span class="lb">Note</span><input class="input" name="note" value="${esc(st.note)}" placeholder="Optional" autocomplete="off" enterkeyhint="done"></label>
        <p class="err" hidden></p>
        <div class="actions">${edit ? '<button class="btn danger" data-act="del">Delete</button>' : ''}<button class="btn primary" data-act="save">${edit ? 'Save changes' : 'Save'}</button></div>`;
    }
  });
}

/* ---------- categories: add, rename, change icon, delete ---------- */
function openCategory(cat, type, onDone) {
  if (cat && cat.id.startsWith('def-')) return toast('Connect your Google Sheet first, then you can edit categories.');
  const st = { name: cat ? cat.name : '', icon: cat ? cat.icon || '🏷️' : '🏷️', type: cat ? cat.type : type };
  const emojis = EMOJIS.includes(st.icon) ? EMOJIS : [st.icon, ...EMOJIS];
  const uses = () => S.data.Transactions.filter(t => t.type === cat.type && t.category.toLowerCase() === cat.name.toLowerCase());
  const act = {
    close: () => sh.close(),
    type: b => { st.type = b.dataset.v; sh.draw(); },
    emo: b => { st.icon = b.dataset.v; sh.draw(); },
    save: () => {
      const name = st.name.trim().replace(/\s+/g, ' ');
      if (!name) return sh.error('Enter a name.');
      const clash = cats().find(c => c.type === st.type && c.name.toLowerCase() === name.toLowerCase() && (!cat || c.id !== cat.id));
      if (clash) return sh.error(`${clash.name} already exists.`);
      sh.close();
      if (!cat) {
        commit([{ op: 'upsert', table: 'Categories', row: { id: uid(), type: st.type, name, icon: st.icon } }], `Added ${name}`);
        if (onDone) onDone(name);
        return;
      }
      const ops = [{ op: 'upsert', table: 'Categories', row: { id: cat.id, name, icon: st.icon } }];
      const moved = name !== cat.name ? uses() : [];
      moved.forEach(t => ops.push({ op: 'upsert', table: 'Transactions', row: { id: t.id, category: name } }));
      commit(ops, moved.length ? `Renamed. ${plural(moved.length, 'entry', 'entries')} updated` : 'Category saved');
      if (onDone) onDone(name, cat.name);
    },
    del: () => {
      const n = uses().length;
      if (!confirm(n ? `Delete “${cat.name}”? Its ${plural(n, 'past entry keeps', 'past entries keep')} the name.` : `Delete “${cat.name}”?`)) return;
      sh.close();
      commit([{ op: 'delete', table: 'Categories', id: cat.id }], `Deleted ${cat.name}`, [{ op: 'upsert', table: 'Categories', row: { ...cat } }]);
      if (onDone) onDone(null, cat.name);
    }
  };
  const sh = sheet({
    state: st, act, enter: () => act.save(),
    after: api => { if (!cat) { const i = $('[name=name]', api.el); if (i && !st.name) setTimeout(() => i.focus(), 80); } },
    view: () => `<div class="grab"></div>
      <div class="sheet-head"><h2><span class="t">${cat ? 'Edit category' : 'New category'}</span></h2>${closeBtn}</div>
      ${cat ? '' : `<div class="seg" role="group" aria-label="Category type"><button data-act="type" data-v="expense" aria-pressed="${st.type === 'expense'}">Expense</button><button data-act="type" data-v="income" aria-pressed="${st.type === 'income'}">Income</button></div>`}
      <label class="field"><span class="lb">Name</span><input class="input" name="name" value="${esc(st.name)}" maxlength="30" autocomplete="off" enterkeyhint="done"></label>
      <div class="field"><span class="lb">Icon</span><div class="emoji-grid">${emojis.map(e => `<button data-act="emo" data-v="${esc(e)}" aria-pressed="${e === st.icon}" aria-label="Icon ${esc(e)}">${esc(e)}</button>`).join('')}</div></div>
      <p class="err" hidden></p>
      <div class="actions">${cat ? '<button class="btn danger" data-act="del">Delete</button>' : ''}<button class="btn primary" data-act="save">${cat ? 'Save' : 'Add category'}</button></div>`
  });
}

/* ---------- entries of one category (from the charts) ---------- */
function openDrill(type, key) {
  const sh = sheet({
    live: true,
    act: { close: () => sh.close(), tx: b => { const t = findTx(b.dataset.id); if (t) openTx(t); } },
    view: () => {
      const list = monthTx(S.month).filter(t => t.type === type && catInfo(type, t.category).key === key).sort(byNewest);
      const c = list.length ? catInfo(type, list[0].category) : { name: 'Category', icon: '•' };
      const sum = totals(list)[type === 'income' ? 'inc' : 'exp'];
      return `<div class="grab"></div><div class="sheet-head"><h2><span class="ic sm">${esc(c.icon)}</span><span class="t">${esc(c.name)}</span></h2>${closeBtn}</div>
        <p class="hint">${esc(monthName(S.month))}: ${plural(list.length, 'entry', 'entries')}, ${inr(sum)} in total.</p>
        ${list.length ? `<ul class="list flush">${list.map(t => txRow(t, true)).join('')}</ul>` : '<div class="empty slim">No entries left here.</div>'}`;
    }
  });
}

/* ---------- settings ---------- */
function openSettings() {
  const st = { url: S.settings.url, key: S.settings.key, show: false, msg: '', bad: false };
  const act = {
    close: () => sh.close(),
    show: () => { st.show = !st.show; sh.draw(); },
    save: async () => {
      const url = st.url.trim(), key = st.key.trim();
      if (!url && !key) { S.settings = { url: '', key: '' }; localStorage.setItem(APP.settings, JSON.stringify(S.settings)); Object.assign(st, { msg: 'Disconnected. Entries now stay on this phone.', bad: false }); paintSync(); renderAll(); return sh.draw(); }
      if (!/^https:\/\/script\.google\.com\/\S+\/exec\/?$/.test(url)) { Object.assign(st, { msg: 'Paste the Web app URL from Apps Script. It starts with https://script.google.com/ and ends with /exec.', bad: true }); return sh.draw(); }
      if (!key) { Object.assign(st, { msg: 'Enter the passphrase you set in the Apps Script.', bad: true }); return sh.draw(); }
      S.settings = { url, key };
      localStorage.setItem(APP.settings, JSON.stringify(S.settings));
      Object.assign(st, { msg: 'Connecting…', bad: false }); sh.draw();
      S.sync.error = '';
      await pull();
      if (S.sync.error) Object.assign(st, { msg: S.sync.error, bad: true });
      else Object.assign(st, { msg: `Connected. ${plural(S.data.Transactions.length, 'entry', 'entries')} in your sheet.`, bad: false });
      sh.draw();
    },
    sync: () => { if (connected()) pull(); },
    clear: () => {
      const n = S.outbox.length;
      if (!confirm(n ? `${plural(n, 'change has', 'changes have')} not reached your sheet yet and will be lost. Clear anyway?` : 'Remove the copy of your data on this phone? Your Google Sheet is not touched.')) return;
      S.data = { Transactions: [], Categories: DEFAULT_CATS.map(c => ({ ...c })) }; S.outbox = []; S.lastSync = 0; S.writes++;
      save(); renderAll(); paintSync();
      toast('Cleared from this phone');
      if (connected()) pull();
    }
  };
  const sh = sheet({
    state: st, act, enter: () => act.save(),
    view: () => `<div class="grab"></div>
      <div class="sheet-head"><h2><span class="t">Settings</span></h2>${closeBtn}</div>
      <h3 class="sec">Google Sheet</h3>
      <label class="field"><span class="lb">Apps Script web app URL</span><input class="input" name="url" value="${esc(st.url)}" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="url"></label>
      <label class="field"><span class="lb">Passphrase</span><span class="pw"><input class="input" name="key" type="${st.show ? 'text' : 'password'}" value="${esc(st.key)}" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="link-btn" data-act="show">${st.show ? 'Hide' : 'Show'}</button></span></label>
      <p class="${st.bad ? 'err' : 'okmsg'}" ${st.msg ? '' : 'hidden'}>${esc(st.msg)}</p>
      <div class="actions"><button class="btn primary" data-act="save">Save and connect</button></div>
      <div class="sync-info" id="syncInfo">${syncInfoHtml()}</div>
      <button class="btn ghost wide" data-act="sync">Sync now</button>
      <h3 class="sec">This phone</h3>
      <p class="hint">A copy of your entries is kept here so the app opens instantly and works offline.</p>
      <button class="btn ghost wide" data-act="clear">Clear data on this phone</button>`
  });
}

/* ---------- wiring ---------- */
function init() {
  load();
  $('.top').addEventListener('click', e => {
    const b = e.target.closest('[data-h]');
    if (!b) return;
    const a = b.dataset.h;
    if (a === 'prev' || a === 'next') { S.month = shiftMonth(S.month, a === 'prev' ? -1 : 1); renderAll(); }
    else if (a === 'sync') { if (!connected() || S.sync.error) openSettings(); else pull(); }
  });
  const mp = $('#monthPick');
  mp.addEventListener('change', () => { if (/^\d{4}-\d{2}$/.test(mp.value)) { S.month = mp.value; renderAll(); } });
  mp.addEventListener('click', () => { try { mp.showPicker(); } catch (e) { /* older browsers open it themselves */ } });
  $('.nav').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.tab) { S.tab = b.dataset.tab; $('#main').scrollTop = 0; renderTab(); }
    else if (b.dataset.n === 'add') openTx();
    else if (b.dataset.n === 'settings') openSettings();
  });
  const acts = {
    tx: b => { const t = findTx(b.dataset.id); if (t) openTx(t); },
    settings: () => openSettings(),
    tbl: b => { S.tables[b.dataset.card] = !S.tables[b.dataset.card]; renderTab(); },
    drill: b => openDrill(b.dataset.type, b.dataset.key),
    rmode: b => { S.rmode = b.dataset.v; renderTab(); },
    year: b => { S.ryear = +b.dataset.v; renderTab(); },
    gomonth: b => { S.month = b.dataset.v; S.tab = 'home'; $('#main').scrollTop = 0; renderAll(); }
  };
  $('#main').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && acts[b.dataset.act]) acts[b.dataset.act](b); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - S.lastPull > 30000) pull(); });
  addEventListener('online', () => flush());
  let lastW = innerWidth, rt;
  addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 8) return; lastW = innerWidth; clearTimeout(rt); rt = setTimeout(() => { if (S.tab !== 'home') renderTab(); }, 150); });
  renderAll(); paintSync();
  pull();
}
init();
</script>
